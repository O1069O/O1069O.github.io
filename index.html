    <script>
    "use strict";
    /* ======= 数据（与原版同一份精读表与讲解内容，逐字搬入） ======= */
    var CONTENT = {"GLOSSARY":[{"term":"焦亡","en":"pyroptosis","plain":"一种「放火式」死亡：细胞被炎症激活，在膜上打孔、胀破，把炎症因子喷出去报警。动静大、带炎症，执行者是 GSDMD。","keys":["焦亡"]},{"term":"凋亡","en":"apoptosis","plain":"「安静自杀」：细胞有序收缩、打包成小泡被邻居吃掉，不漏内容物、不发炎。标志是 caspase-3 被切活、BAX/Bcl-2 比值升高。","keys":["凋亡"]},{"term":"坏死性凋亡","en":"necroptosis","plain":"名字带凋亡、样子像坏死：RIPK1/RIPK3 把 MLKL 磷酸化（p-MLKL），p-MLKL 上膜打孔，细胞破裂漏物、带炎症。","keys":["坏死性凋亡","MLKL","RIPK"]},{"term":"铁死亡","en":"ferroptosis","plain":"铁催化的脂质过氧化把细胞膜「锈穿」的死亡。核心防线是 GPX4，防线塌了、膜脂被氧化烂掉，细胞就死。","keys":["铁死亡"]},{"term":"PANoptosis","en":"PANoptosis","plain":"焦亡+凋亡+坏死性凋亡被同一套上游信号（常见是 ROS+线粒体）同时点着的整合型死亡，不是三种死亡简单相加，而是有一个共同指挥部。","keys":["PANoptosis"]},{"term":"ROS / mtROS","en":"reactive oxygen species","plain":"活性氧，细胞呼吸漏出的「火花」；从线粒体来的叫 mtROS。少量是信号，过量就烧伤蛋白、膜和 DNA——课题组毒理链几乎都从它起步。","keys":["ROS","mtROS"]},{"term":"线粒体自噬","en":"mitophagy","plain":"把坏掉的线粒体单独打包送进溶酶体销毁的「定点拆除」，防止坏线粒体持续漏 ROS。PINK1/Parkin 是最经典的一条拆除路线。","keys":["线粒体自噬","PINK1"]},{"term":"自噬","en":"autophagy","plain":"细胞的大扫除系统：把废旧部件包进双层膜囊泡送溶酶体降解回收。LC3 是囊泡标记，p62 是随货物一起被降解的「垃圾标签」。","keys":["自噬"]},{"term":"CMA（分子伴侣介导自噬）","en":"chaperone-mediated autophagy","plain":"不打包囊泡：单个蛋白被伴侣蛋白直接护送、穿过溶酶体膜上的 LAMP-2A 通道进去降解。专拆带特定标签的蛋白，脂滴包被 PLIN2 就是它的客户。","keys":["CMA","LAMP-2A"]},{"term":"脂噬","en":"lipophagy","plain":"自噬的一种，专门把脂滴送去溶酶体降解放脂。小脂滴比大脂滴容易被脂噬处理——所以「先拆小、再清除」是课题组的减脂思路。","keys":["脂噬"]},{"term":"LMP（溶酶体膜透化）","en":"lysosomal membrane permeabilization","plain":"溶酶体的膜漏了，里面的酶（CTSB 等）跑进胞质。是很多链条里「祸水东引」的一步：上游的伤在这里转手给 NLRP3。","keys":["LMP","溶酶体膜透化"]},{"term":"CTSB（组织蛋白酶 B）","en":"cathepsin B","plain":"溶酶体里的蛋白酶，正常在溶酶体内干活；漏到胞质后能激活 NLRP3，是 LMP 下游的关键信使。它的位置会变：有时在链的上游（如经 TFAM 伤线粒体）。","keys":["CTSB","组织蛋白酶"]},{"term":"NLRP3 炎症小体","en":"NLRP3 inflammasome","plain":"胞质里的「警报器」复合体，组装后激活 caspase-1，是焦亡的总开关。ROS、CTSB 等多种上游信号都能按下它。","keys":["NLRP3","炎症小体"]},{"term":"caspase-1","en":"caspase-1","plain":"被 NLRP3 炎症小体激活的蛋白酶，负责切开 GSDMD（产生打孔片段）和炎症因子前体。注意别和凋亡的 caspase-3 混。","keys":["caspase-1"]},{"term":"GSDMD / GSDMD-N","en":"gasdermin D","plain":"GSDMD 被 caspase-1 切一刀后，N 端片段 GSDMD-N 插到膜上打孔——焦亡的「打孔工」。新进展：它还能易位到线粒体打孔，把几种死亡串起来。","keys":["GSDMD"]},{"term":"MLKL / p-MLKL","en":"mixed lineage kinase domain-like","plain":"坏死性凋亡的打孔工。被 RIPK3 磷酸化（p-MLKL）才算激活；只测总 MLKL 变化不能证明坏死性凋亡。它也能打溶酶体和线粒体的膜。","keys":["MLKL"]},{"term":"p62","en":"SQSTM1 / p62","plain":"自噬的货物标签：自噬通畅时它随货物一起被降解，所以 p62 升高常提示自噬堵了。但它是中性工具——堆积的 p62 也能去激活 Nrf2 抗氧化（如酸奶篇）。","keys":["p62"]},{"term":"TFEB","en":"transcription factor EB","plain":"溶酶体与自噬基因的「总开关」转录因子，入核后批量上调自噬/溶酶体装备。课题组多篇靠它点亮线粒体自噬。","keys":["TFEB"]},{"term":"ESCRT-III","en":"ESCRT-III complex","plain":"细胞的「膜修补队」，把膜上小孔周围的膜剪掉封口；CHMP4B 是关键成员。它被抑制，焦亡打的孔就没人修；被激活，则起保护作用。","keys":["ESCRT","CHMP4B"]},{"term":"脂滴","en":"lipid droplet","plain":"细胞存脂肪的「油罐」，表面包着 PLIN 等蛋白。脂滴堆积是脂肪肝的表型；融合长大（CIDEC 干的）后更难被清除。","keys":["脂滴","脂质堆积","脂质沉积"]},{"term":"CIDEC","en":"cell death-inducing DFFA-like effector C","plain":"让小脂滴融合成大脂滴的蛋白。大脂滴难被脂噬，所以抑制 CIDEC 是课题组两篇减脂论文的共同节点。","keys":["CIDEC"]},{"term":"PLIN2 / PLIN3","en":"perilipin 2/3","plain":"脂滴表面的包被蛋白，像油罐的外壳。CMA 先把这层壳拆掉（降解 PLIN2/3），脂滴才容易被降解。","keys":["PLIN"]},{"term":"BMAL1","en":"brain and muscle ARNT-like 1","plain":"生物钟核心转录因子，像个「日程表管理员」，让很多代谢基因按昼夜节奏开关。它被扰乱，下游的抗氧化、燃脂、抗铁死亡系统都会不合拍。","keys":["BMAL1"]},{"term":"REV-ERBα","en":"REV-ERB alpha","plain":"生物钟的「刹车」核受体，压制 BMAL1 等基因的表达。它过强，自噬相关蛋白的节律也会乱套。","keys":["REV-ERB"]},{"term":"GPX4","en":"glutathione peroxidase 4","plain":"细胞防脂质过氧化的「消防员」，铁死亡的核心防线。GPX4 失活/下降是铁死亡的标志性事件，但要成立还需脂质过氧化和铁依赖的证据。","keys":["GPX4"]},{"term":"ACSL4","en":"acyl-CoA synthetase long-chain family member 4","plain":"把易氧化的脂肪酸装进膜脂的酶：装得越多，膜越容易被铁死亡烧穿。常作铁死亡的正向指标（升高=易感）。","keys":["ACSL4"]},{"term":"Fenton 反应","en":"Fenton reaction","plain":"Fe²⁺ 与过氧化氢反应生成破坏力极强的羟基自由基——铁催化的「点火」化学。是溶酶体漏铁能引发铁死亡的原因。","keys":["Fenton","Fe²⁺"]},{"term":"心磷脂","en":"cardiolipin","plain":"线粒体内膜特有的磷脂。线粒体受损时它翻出来暴露，能像「停机坪」一样招募 GSDMD-N 到线粒体上打孔。","keys":["心磷脂"]},{"term":"Cyt-c（细胞色素 c）","en":"cytochrome c","plain":"平时在线粒体里传电子；一旦漏到胞质，就是凋亡的启动信号。很多链条里它是线粒体损伤传给凋亡的信使。","keys":["Cyt-c"]},{"term":"AMPK","en":"AMP-activated protein kinase","plain":"细胞的「电量计」：能量不足时激活，促进分解代谢和 CMA 等清理通路。芹菜素降脂就是先按它。","keys":["AMPK"]},{"term":"PPARα / PPARγ","en":"peroxisome proliferator-activated receptor","plain":"脂代谢的转录调控者：PPARα 主脂肪酸氧化（燃脂总开关，下游管 ATGL、HSL），PPARγ 主脂肪储存与分化。","keys":["PPAR"]},{"term":"miRNA / lncRNA","en":"microRNA / long non-coding RNA","plain":"不编码蛋白的 RNA 调控者：miRNA 像「静音键」压制靶基因；lncRNA 常当「海绵」把 miRNA 吸附走，等于间接放行靶基因。","keys":["miR-","lncRNA","miRNA"]},{"term":"节律（昼夜节律）","en":"circadian rhythm","plain":"基因表达按约 24 小时涨落的规律。节律被「扰乱」不等于某个蛋白简单升高或降低，而可能是振荡曲线没了——读节律论文要看时间点曲线，不能只看单个时间点。","keys":["节律"]},{"term":"敲低 / 过表达","en":"knockdown / overexpression","plain":"把某个基因调低/关掉（常用 siRNA 敲低）或调高（过表达），看表型跟不跟着变。这是验证「谁导致谁」的因果实验，比只看相关性硬得多。","keys":["敲低","过表达","沉默"]},{"term":"抑制剂 / 激活剂对照","en":"inhibitor / activator control","plain":"用已知药理工具堵住或打开某个节点（如 MCC950 堵 NLRP3、CsA 堵线粒体自噬、QX77 开 CMA），表型能被逆转，才说明链条成立。精读时先找这类「逆转句」。","keys":["抑制剂","激活剂","MCC950","CsA"]}],"DRUGS":[{"name":"芹菜素","en":"apigenin","cat":"功能成分","use":"芹菜、洋甘菊等植物里的黄酮类化合物，抗氧化、抗炎，是食品功能成分研究的常客。","inGroup":"课题组的「多面手」：三篇分别走促线粒体自噬抑焦亡、激活 AMPK 促 CMA 降脂滴、经 AKT—CIDEC 促脂噬三条路。","note":"同一个成分在不同篇里机制完全不同——读的时候别把上一篇的机制默认套到下一篇，先看它这次接的是哪条链。","keys":["芹菜素"]},{"name":"漆黄素","en":"fisetin","cat":"功能成分","use":"草莓、苹果等果蔬里的黄酮醇，抗氧化，也被研究作抗衰老（senolytic）成分。","inGroup":"节律线的干预物：上调 BMAL1、纠正节律紊乱，再经 CIDEC 抑制脂滴融合、帮脂噬清脂。","note":"它是「功能成分 × 节律蛋白」交叉的代表：看它的论文要同时盯 BMAL1 的节律曲线和脂滴形态图。","keys":["漆黄素"]},{"name":"人参皂苷 Rb1","en":"ginsenoside Rb1","cat":"功能成分","use":"人参的主要活性皂苷成分之一，药理研究里常报抗炎、抗氧化、护肝护肾。","inGroup":"三篇三种打法：抑 miR-128 促 TFEB 自噬降脂、激活线粒体自噬抗 3-MCPD 肾焦亡、走 PINK1/Parkin 抗 ConA 肝焦亡——共同点都绕着「促自噬/线粒体自噬」。","note":"Rb1 的论文适合横着读：终点（焦亡/脂堆积）和器官（肝/肾）都换，变的只是自噬被打开的方式。","keys":["Rb1","人参皂苷"]},{"name":"乳铁蛋白","en":"lactoferrin, LF","cat":"功能成分","use":"牛奶（尤其初乳）里的铁结合糖蛋白，天职是结合铁、抑菌，食品里也作营养强化剂。","inGroup":"两篇各用一面：酒精篇用它的「螯合铁」纠正铁过载、抑铁死亡；LPS 篇用它促线粒体自噬、抑坏死性凋亡。","note":"它本身结合铁，所以出现在铁死亡论文里不是巧合——先想清「铁」在这篇里是病因还是指标。","keys":["乳铁蛋白"]},{"name":"辣椒素","en":"capsaicin","cat":"功能成分","use":"辣椒的辣味成分，TRPV1 通道的激动剂；食品风味物质，也是神经/代谢研究常用工具分子。","inGroup":"激活 TRPV1 引 Ca²⁺ 内流，招来 ESCRT-III 膜修复队修补焦亡捅破的细胞膜，缓解酒精性肝焦亡。","note":"这篇的保护思路很特别：不是拦着别打孔，而是孔打了之后「修」——读图重点是膜修复的证据，不是死亡蛋白降了多少。","keys":["辣椒素"]},{"name":"D-乳酸（酸奶代谢物）","en":"D-lactic acid","cat":"功能成分","use":"乳酸菌发酵产生的代谢物，酸奶等发酵食品里天然存在；和人体主产的 L-乳酸是镜像异构体。","inGroup":"酸奶篇的实际功效分子：抑自噬让 p62 累积，p62 转去非经典激活 Nrf2 抗氧化，最终压下酒精性肝焦亡。","note":"这篇故意反常识：保护靠的是「抑自噬」而不是「促自噬」。看到 D-乳酸先提醒自己——p62 在这里是功臣。","keys":["D-乳酸","酸奶"]},{"name":"MCC950","en":"MCC950 (NLRP3 inhibitor)","cat":"工具药","use":"NLRP3 炎症小体的特异性小分子抑制剂，焦亡研究里最常用的「关总闸」工具药。","inGroup":"精读表没点名，但它是验证「这条链归不归 NLRP3 管」的标准动作：加上它焦亡消失，就证明 NLRP3 是必经节点。","note":"读焦亡论文先找有没有这类抑制剂回补实验；只有表达变化、没有抑制剂验证的，因果链要打折看。","keys":["NLRP3"]},{"name":"NAC（N-乙酰半胱氨酸）","en":"N-acetylcysteine","cat":"工具药","use":"ROS 清除剂兼谷胱甘肽前体，临床上是化痰药和对乙酰氨基酚中毒的解毒剂，实验室里是最常用的抗氧化工具药。","inGroup":"验证「ROS 在不在上游」的标配：预处理 NAC 后若下游死亡/损伤指标全线回落，就说明 ROS 是这条链的点火者。","note":"NAC 能救回来只能证明 ROS 参与，不能定位 ROS 来自线粒体还是别处——定位要靠 MitoSOX、线粒体靶向抗氧化剂等进一步证据。","keys":["ROS"]},{"name":"氯喹 CQ","en":"chloroquine","cat":"工具药","use":"老牌抗疟药，在细胞实验里抬高溶酶体 pH、堵住自噬体降解，是测「自噬通量」的标准阻断剂。","inGroup":"判自噬通畅与否的关键对照：LC3-II 到底升没升要和加 CQ 的组比——加了 CQ 还继续涨，才说明是真堵在降解端。","note":"CQ 堵的是自噬的「下游出口」；拿它当「自噬抑制剂」用没问题，但别把 CQ 组的变化直接读成自噬被激活。","keys":["自噬","氯喹","CQ"]},{"name":"环孢素 A（CsA）","en":"cyclosporin A","cat":"工具药","use":"免疫抑制剂（器官移植用），同时抑制线粒体通透性转换孔（mPTP），实验里常用它反证线粒体自噬/线粒体途径的参与。","inGroup":"乳铁蛋白 LPS 篇的回补工具：CsA 能把乳铁蛋白的保护作用逆转，证明保护确实经由线粒体自噬这条线。","note":"「药物保护被某个抑制剂逆转」是整组论文最硬的因果句式，看到 CsA、CQ 这类名字，先找它逆转了什么。","keys":["CsA","环孢素"]},{"name":"CA-074Me","en":"CA-074 methyl ester","cat":"工具药","use":"组织蛋白酶 B（CTSB）的细胞透过型特异性抑制剂，专门用来验证 CTSB 在链条里的位置。","inGroup":"LMP—CTSB 这条高频桥的标准验证工具：抑制 CTSB 后 NLRP3 焦亡降下来，就坐实了「CTSB 泄漏点火」这一步。","note":"注意 CTSB 在课题组位置不固定：多数篇里在 LMP 下游当信使，3-MCPD 酯篇里却在上游经 TFAM 伤线粒体——抑制剂实验正好能分辨其本次所处位置。","keys":["CTSB"]},{"name":"QX77","en":"QX77 (CMA activator)","cat":"工具药","use":"分子伴侣介导自噬（CMA）的小分子激活剂，经视黄酸受体通路增强 LAMP-2A 介导的降解。","inGroup":"反油酸 CMA 篇的挽救工具：反油酸把 CMA 打坏后，QX77 激活 CMA 能缓解脂质堆积——「激活剂能救」与「抑制剂能堵」是一对镜像证据。","note":"CMA 领域工具药很少，QX77 几乎是标配；看到它就知道作者在做 CMA 的因果验证，而不是只测了 LAMP-2A 的量。","keys":["QX77","CMA"]},{"name":"Ferrostatin-1（Fer-1）","en":"ferrostatin-1","cat":"工具药","use":"铁死亡的特异性抑制剂，靠清除脂质过氧自由基踩刹车，是判定铁死亡的「金标准」回补药之一（另一个是铁螯合剂去铁胺 DFO）。","inGroup":"读铁死亡篇的验收标准：GPX4 降、MDA 升只是疑似，Fer-1 或铁螯合剂能把细胞从死亡里救回来，才算把「铁依赖」钉死。","note":"精读时专门找有没有这类挽救实验；没有的话，结论先按「脂质过氧化相关死亡」保守理解。","keys":["铁死亡"]},{"name":"棕榈酸 PA","en":"palmitic acid","cat":"造模与处理","use":"最常见的饱和脂肪酸，细胞实验里模拟高脂/游离脂肪酸（FFA）环境的标准造模剂，常与油酸配成 FFA 混合液。","inGroup":"体外「喂胖」肝细胞的标配处理：芹菜素抗 HFD 焦亡篇里，体内是高脂饮食、体外对应的就是棕榈酸。","note":"棕榈酸本身有脂毒性（促凋亡），配制时要与 BSA 结合；读图时分清效应来自脂堆积还是它自带的毒性。","keys":["棕榈酸","FFA"]},{"name":"高脂饮食 HFD","en":"high-fat diet","cat":"造模与处理","use":"给小鼠喂高脂肪含量饲料数周，造非酒精性脂肪肝（NAFLD）/肥胖模型，是体内脂代谢研究的标准造模法。","inGroup":"线三、线四多篇的体内模型底座：芹菜素、Rb1、漆黄素等保护实验都在 HFD 背景上检验降脂效果。","note":"HFD 是慢性造模，周期以周计；和急性给药模型比，它的表型（脂肪肝）更像人的真实病程，但影响因素也更多。","keys":["HFD","高脂"]},{"name":"LPS（脂多糖）","en":"lipopolysaccharide","cat":"造模与处理","use":"革兰阴性菌外膜成分，即内毒素；免疫/炎症研究的标准刺激剂，经 TLR4 点火炎症与氧化应激。","inGroup":"乳铁蛋白篇的损伤源：LPS 打坏肝细胞线粒体、抬 ROS，引出坏死性凋亡，乳铁蛋白靠促线粒体自噬来挡。","note":"LPS 模型模拟的是感染/内毒素冲击，和酒精、危害物的化学损伤不是一回事——读的时候先认清损伤类型再看机制。","keys":["LPS"]},{"name":"ConA（刀豆蛋白 A）","en":"concanavalin A","cat":"造模与处理","use":"植物凝集素，静脉注射小鼠可快速引发 T 细胞介导的免疫性肝损伤，是模拟自身免疫性肝炎的经典造模剂。","inGroup":"Rb1 抗焦亡篇的造模剂：ConA 造免疫性肝损伤，Rb1 走 PINK1/Parkin 线粒体自噬灭火。","note":"ConA 模型是急性、免疫驱动的，起病以小时计；它造的焦亡带着强炎症背景，和毒物直伤肝的链条起点不同。","keys":["ConA"]},{"name":"乙醇（急性酒精模型）","en":"ethanol","cat":"造模与处理","use":"酒精性肝损伤的造模剂：动物多用单次大剂量灌胃（急性）或长期喂养（慢性），细胞直接加乙醇或其代谢物处理。","inGroup":"三篇的共同损伤源：酸奶（D-乳酸）抗焦亡、乳铁蛋白抗铁死亡、辣椒素靠膜修复抗焦亡——同一种损伤，三种挡法。","note":"急性酒精模型看的是「一顿大酒」的冲击，别把它的结论直接外推到慢性饮酒；读的时候留意原文写的是急性还是慢性。","keys":["酒精","乙醇"]},{"name":"聚苯乙烯微塑料 PS-MPs","en":"polystyrene microplastics","cat":"危害物","use":"塑料降解产生的微米级颗粒，食物和饮用水里可检出；毒理研究里多用聚苯乙烯微球作模型微塑料经口暴露。","inGroup":"2026 新篇的处理物：一条链串起焦亡、铁死亡、凋亡三重死亡，关键步是 GSDMD-N 易位线粒体打孔。","note":"微塑料研究最要盯的是颗粒粒径、剂量和暴露途径像不像真实摄入——这决定结论能不能往食品安全上靠。","keys":["微塑料"]},{"name":"苯并[a]芘 BaP","en":"benzo[a]pyrene","cat":"危害物","use":"多环芳烃代表物，烧烤、烟熏食品和烟草烟雾里常见，经典致癌物，经 AhR 代谢活化后产生活性中间体与 ROS。","inGroup":"PANoptosis 篇的处理物：ROS 同时点焦亡与坏死性凋亡，两种打孔蛋白易位线粒体再带出凋亡。","note":"BaP 的毒性依赖代谢活化，体内外剂量不可直接类比；读它先看作者用的是原形还是代谢物处理。","keys":["苯并","BaP"]},{"name":"亚硫酸钠 / 焦亚硫酸钠","en":"sodium sulfite / sodium metabisulfite","cat":"危害物","use":"亚硫酸盐类食品添加剂（防腐、护色、漂白），葡萄酒、干果、蜜饯里常用；过量摄入有肝与过敏风险。","inGroup":"一个家族三篇：亚硫酸钠在肝里打出 PANoptosis 和铁死亡两条线，焦亚硫酸钠在肥大细胞里连起焦亡与脱颗粒（致敏）。","note":"同族物质换个器官、换个细胞就是新故事：读的时候对比「处理物相近、链条为何不同」，答案多在模型选角上。","keys":["亚硫酸钠","焦亚硫酸"]},{"name":"反油酸（反式脂肪酸）","en":"elaidic acid","cat":"危害物","use":"反式脂肪酸的代表，来自部分氢化植物油（人造奶油、起酥油）和油炸食品，与心血管和代谢疾病相关。","inGroup":"两副面孔：老篇里异常激活自噬促肝焦亡，新篇里抑 CMA 致脂质堆积——同一种危害物，肝里既伤又堵。","note":"反油酸 ≠ 油酸：只差一个双键构型，毒性叙事完全不同；读脂代谢论文先分清顺反。","keys":["反油酸"]},{"name":"3-MCPD 及其酯","en":"3-MCPD / 3-MCPD esters","cat":"危害物","use":"精炼植物油（尤其棕榈油）加工中生成的氯丙醇类危害物，酯形式随油脂吃入、在体内水解释放游离 3-MCPD，肾是主要靶器官之一。","inGroup":"课题组出现频率最高的危害物之一：其酯在 HepG2 诱导坏死性凋亡，游离体在肾抑制 ESCRT-III/线粒体自噬致焦亡、扰动 BMAL1 损伤线粒体，亦为 Rb1 的干预对象。","note":"注意区分「酯」和「游离 3-MCPD」：哪篇用哪种、进的是肝还是肾，是横向对比这几篇的第一道题。","keys":["3-MCPD"]},{"name":"1,3-DCP（1,3-二氯-2-丙醇）","en":"1,3-dichloro-2-propanol","cat":"危害物","use":"与 3-MCPD 同家族的氯丙醇类加工危害物，见于精炼油、酱油等食品，有肝肾毒性。","inGroup":"节律线的常客处理物：在肾扰 BMAL1/GPX4 引铁死亡，在肝抑 BMAL1 堵中性脂肪酶、扰 REV-ERBα 抑自噬，两头都连着脂滴堆积。","note":"1,3-DCP 的论文几乎都带节律蛋白——看到它就预判这篇要测多时间点曲线，而不是单点条带。","keys":["1,3-DCP"]},{"name":"缩水甘油（及其酯）","en":"glycidol / glycidyl esters","cat":"危害物","use":"与 3-MCPD 酯伴生的油脂加工危害物（缩水甘油酯），体内释放缩水甘油，有肾毒性与遗传毒性关注。","inGroup":"肾损伤线的处理物：堵自噬让 p62 聚集，p62 招募 RIPK1 组装坏死体引坏死性凋亡，另带 NF-κB 促炎。","note":"这篇里 p62 从指标变凶手；读缩水甘油先想它和 3-MCPD 的亲缘关系，再看链条为什么拐到了自噬—坏死体。","keys":["缩水甘油"]},{"name":"黄曲霉毒素 B1（AFB1）","en":"aflatoxin B1","cat":"危害物","use":"霉变花生、玉米等粮油里的强致癌真菌毒素，肝毒性最出名，肾同样受害；毒性依赖肝内代谢活化。","inGroup":"肾损伤线的处理物：坏线粒体自噬起步，经 LMP—CTSB 点焦亡，GSDMD-N 被心磷脂招募上线粒体打孔，再串出非经典凋亡。","note":"和微塑料篇对照读：同样是 GSDMD-N 上线粒体打孔，这里的招募机制是心磷脂——枢纽相同、招募方式不同。","keys":["黄曲霉毒素","AFB1"]}],"METHODS":[{"name":"Western Blot（蛋白免疫印迹）","en":"Western blot, WB","use":"测定样本中目标蛋白的含量、剪切与磷酸化状态，为本组论文中使用频率最高的方法。","principle":"蛋白按分子量电泳分开，转到膜上，用特异性抗体逐层识别，化学发光显影成条带；条带灰度 ≈ 蛋白量。","steps":"提蛋白定量 → SDS-PAGE 电泳 → 转膜 → 封闭 → 一抗孵育 → 二抗 → 发光成像 → 灰度定量（对内参如 β-actin 归一化）。","proves":"通路蛋白的表达与激活状态：NLRP3/caspase-1 p20/GSDMD-N 说焦亡，p-MLKL 说坏死性凋亡，cleaved-caspase-3 说凋亡。","note":"看带先看「形态」再看「量」：被切割的蛋白会出现更小的条带（如 GSDMD-N、caspase-1 p20），仅看总蛋白条带易得出错误结论。实验室每周的 WB 电泳预约即针对此项实验。","keys":["WB","条带"]},{"name":"qPCR（实时荧光定量 PCR）","en":"quantitative real-time PCR","use":"测某个基因的 mRNA 表达量，回答「这个基因是被转录调高了还是调低了」。","principle":"把 RNA 反转录成 cDNA 后扩增，荧光随产物量实时增长；Ct 值越小、起始模板越多，用 2^-ΔΔCt 相对内参算倍数变化。","steps":"提 RNA → 反转录 → 设计引物 → 上机扩增读 Ct → 对内参（如 GAPDH）归一化算相对表达。","proves":"转录层面的变化：炎症因子、脂代谢基因、节律基因（BMAL1 等）的 mRNA 涨落；节律论文靠它在多时间点上画表达曲线。","note":"qPCR 测的是 mRNA，不是蛋白：转录升了蛋白未必跟得上（还有翻译与降解）。论文里 mRNA 与 WB 结果打架时，先想这一层。","keys":["qPCR","mRNA","转录"]},{"name":"免疫荧光与共定位（激光共聚焦）","en":"immunofluorescence / confocal microscopy","use":"在细胞里「看»某个蛋白在哪儿、和谁待在一起——易位、共定位类结论唯一的证据来源。","principle":"荧光标记抗体染目标蛋白，共聚焦显微镜逐层成像；两个蛋白的荧光信号在同一像素重合（颜色叠加），才叫共定位。","steps":"细胞爬片 → 固定透化 → 封闭 → 一抗/荧光二抗 → 染核（DAPI）→ 封片 → 共聚焦拍照 → 共定位系数分析。","proves":"GSDMD-N 有没有去线粒体、线粒体有没有进溶酶体（线粒体自噬）、CTSB 有没有从溶酶体漏成弥散状。","note":"「重合」要看叠加图和定量系数，只放两张单通道图并排不算证据；另外荧光串色、抗体非特异都会造假重合，老练的读者会找阴性对照。","keys":["共定位","荧光","易位"]},{"name":"流式细胞术","en":"flow cytometry","use":"让细胞排队逐个过激光，批量统计「多少细胞处于什么状态」，是定量细胞比例的标准工具。","principle":"荧光探针或抗体给细胞打标记，仪器逐个读荧光强度，散点图按象限/门控统计阳性比例。","steps":"收集细胞 → 探针/抗体染色 → 上机采集 → 设门分析（如 Annexin V/PI 双染分象限）→ 出阳性率。","proves":"Annexin V/PI 双染分凋亡早晚期与坏死；C11-BODIPY 测脂质 ROS；探针测 Fe²⁺、ROS 阳性率——都是「百分比」型证据。","note":"流式给的是比例和强度分布，不是照片：读图先看设门合不合理、对照组门画在哪；换个门，结论能差出一倍。","keys":["流式","Annexin"]},{"name":"ROS 荧光探针（DCFH-DA / MitoSOX）","en":"ROS fluorescent probes","use":"测细胞内活性氧水平：DCFH-DA 看全细胞总 ROS，MitoSOX 专看线粒体 ROS（mtROS）。","principle":"探针本身不发光，被 ROS 氧化后变荧光，亮度与 ROS 量正相关；可用荧光显微镜拍照或流式定量。","steps":"活细胞加载探针 → 避光孵育 → 洗去多余探针 → 拍照或上流式 → 比荧光强度。","proves":"几乎每条毒理链的起点证据：「mtROS↑」这句话落在哪，就看 MitoSOX 的图；NAC 预处理后荧光回落，是 ROS 在上游的因果补证。","note":"链条写 mtROS 就该对应 MitoSOX，只给 DCFH-DA 的要留个心眼——那是总 ROS，不能替线粒体背书。探针怕光、易自氧化，孵育时间也影响读数。","keys":["ROS","mtROS","DCFH","MitoSOX"]},{"name":"JC-1 线粒体膜电位","en":"JC-1 mitochondrial membrane potential assay","use":"测线粒体膜电位高低——线粒体「健康度」最常用的速测指标。","principle":"膜电位高时 JC-1 聚集成红色荧光团，电位塌了则散成绿色单体；红/绿比值下降 = 膜电位受损。","steps":"活细胞加载 JC-1 → 孵育洗涤 → 荧光拍照或流式测红绿比 → 与对照组比。","proves":"「线粒体功能障碍/损伤」这一步的落地证据：危害物组红绿比掉、保护成分组恢复，链条第一环就站住了。","note":"膜电位下降是线粒体受损的信号，但不是死亡判决——早期可恢复。读图看比值别只看单色亮度，细胞密度也会影响单色强度。","keys":["膜电位","JC-1","线粒体功能障碍"]},{"name":"透射电镜 TEM","en":"transmission electron microscopy","use":"看细胞内部超微结构：线粒体肿不肿、嵴还在不在、有没有自噬体、脂滴长什么样。","principle":"电子束穿透超薄切片成像，分辨率到纳米级，是唯一能「亲眼看见」自噬体双层膜和线粒体内部结构的方法。","steps":"样本固定（戊二醛）→ 脱水包埋 → 超薄切片 → 铀铅双染 → 电镜下找视野拍照。","proves":"形态学铁证：线粒体损伤、自噬体/自噬溶酶体数量、脂滴大小——WB 说蛋白变了，电镜说结构真的变了。","note":"电镜视野小、代表性靠取样：几张图不能代表整群细胞，必须配合定量指标（计数多个视野）。看到只给一张惊艳电镜图的，要多问一句样本量。","keys":["电镜","自噬体"]},{"name":"LDH 释放 / PI 染色（膜完整性）","en":"LDH release assay / PI staining","use":"测细胞膜破没破：膜一破，胞内的 LDH 漏到培养液里，PI 也才进得去染核。","principle":"LDH 是胞质酶、正常出不来，测培养上清里的 LDH 活性即可量化破膜比例；PI 是膜不透性染料，只染膜破的死细胞。","steps":"取培养上清（LDH）或活细胞加 PI → 酶标仪读吸光度 / 荧光拍照计数 → 算释放率或阳性率。","proves":"焦亡、坏死性凋亡这类「破膜型死亡」真的发生了：蛋白条带说通路激活，LDH/PI 说膜的结局，两者要分开看、互相印证。","note":"LDH 升只说明膜破，不区分死法——焦亡破、坏死性凋亡也破。拿它单独证明焦亡是新手常见错误，必须配 GSDMD-N 条带。","keys":["LDH","PI","膜破"]},{"name":"CCK-8 / MTT 细胞活力","en":"CCK-8 / MTT cell viability assay","use":"测一群细胞还活着多少，是定处理剂量、看保护效果的第一道粗筛。","principle":"活细胞的脱氢酶把试剂染料还原成有色产物，吸光度与活细胞数正相关（CCK-8 水溶、不用溶解结晶，比 MTT 省事）。","steps":"细胞铺板 → 加药处理 → 加 CCK-8 试剂孵育 → 酶标仪读 450 nm 吸光度 → 算存活率。","proves":"剂量—效应曲线和「保护成分把存活率拉回来多少」；几乎每篇体外实验的图一都是它。","note":"它测的是代谢活力不是细胞数：药物若直接影响线粒体代谢，会假性改变读数。选剂量时还要避开「浓度高到全是毒性」的区间。","keys":["CCK-8","活力","存活"]},{"name":"脂滴染色与 TG 定量（油红 O / BODIPY）","en":"Oil Red O / BODIPY staining & TG assay","use":"看脂滴：油红 O 把中性脂染红（组织/细胞），BODIPY 493/503 荧光染脂滴可看大小分布；TG 试剂盒测甘油三酯总量。","principle":"脂溶性染料溶进脂滴显色/发光，形态拍照看数量与粒径；TG 经酶法显色定量，是「总账」。","steps":"固定细胞/冰冻切片 → 染色 → 拍照看脂滴形态 → 另取样本裂解测 TG（对蛋白量归一化）。","proves":"脂质堆积的表型证据：讲「抑制融合、拆小脂滴」的论文（CIDEC 线），形态图是核心、TG 是陪衬；两者方向不一致时以问题为准。","note":"脂滴变小 ≠ 脂总量变少：CIDEC 被抑时是「大滴拆小滴等着被脂噬」，短期内 TG 可能没降多少——只看 TG 会误判这类机制。","keys":["油红","BODIPY","TG","脂滴"]},{"name":"铁死亡指标组合（C11-BODIPY / Fe²⁺ / MDA / GSH）","en":"ferroptosis readout panel","use":"铁死亡没有单一金指标，靠一组指标拼图：脂质 ROS、游离铁、过氧化产物、还原储备各测一头。","principle":"C11-BODIPY 被脂质过氧化物氧化后荧光变色（流式测）；Fe²⁺ 用 FerroOrange 等探针；MDA 是脂质过氧化终产物（试剂盒）；GSH 是抗氧化储备（试剂盒）。","steps":"按指标分别取样：活细胞加载探针上流式（C11-BODIPY、Fe²⁺），裂解液走试剂盒（MDA、GSH），再配 WB 看 GPX4/ACSL4。","proves":"防线塌（GPX4↓）、燃料足（Fe²⁺↑）、火烧起来了（脂质 ROS/MDA↑）、水用完了（GSH↓）——四角齐了，再加 Fer-1 挽救，才敢下铁死亡结论。","note":"单看一个指标就喊铁死亡是这组论文最要防的读法；精读时按「铁、过氧化、防线、挽救」四格逐格打勾。","keys":["铁死亡","MDA","GSH","C11","Fe²⁺"]},{"name":"溶酶体完整性与 CTSB 分布（AO 染色等）","en":"lysosomal integrity / CTSB distribution assay","use":"测溶酶体膜漏没漏（LMP）：吖啶橙 AO、LysoTracker 标记酸性溶酶体，再看 CTSB 是点状还是弥散。","principle":"AO/LysoTracker 只在完好酸性溶酶体里聚集发光，膜漏、酸性丢失荧光就散；CTSB 免疫荧光从「困在点里」变「糊满胞质」，就是泄漏的现场。","steps":"活细胞加载 AO/LysoTracker 拍照，或固定后做 CTSB 免疫荧光 → 比点状/弥散形态 → 可配 CA-074Me 抑制对照。","proves":"LMP—CTSB 这一步的现场证据：几乎所有走这条桥的焦亡链，都要靠它把「漏」字坐实，而不只是测 CTSB 总量。","note":"CTSB 的 WB 总量不变、位置变了才是关键——只测表达量会错过整条链。读图找的应该是分布形态，不是条带灰度。","keys":["LMP","CTSB","溶酶体"]},{"name":"siRNA 敲低 / 过表达（遗传学验证）","en":"siRNA knockdown / overexpression","use":"把某个基因临时关小（siRNA 敲低）或开大（质粒过表达），看表型跟不跟着变——因果验证的另一条腿（另一条是工具药）。","principle":"siRNA 引导降解目标 mRNA，蛋白随之减少；过表达质粒则让细胞多产该蛋白。转染后先用 WB/qPCR 验效率，再看表型。","steps":"设计 siRNA/构建质粒 → 转染细胞 → 24–72 h 后验敲低/过表达效率 → 加处理物 → 测下游表型。","proves":"「这个节点是必经之路」：敲低 BMAL1 表型加重、过表达又救回来，一关一开方向相反，因果就钉死了——节律线、自噬线都靠它收尾。","note":"先看效率验证图再信结论：敲低只降了 20% 就谈表型，证据不足；还要有阴性对照 siRNA 排除转染本身的影响。","keys":["敲低","过表达","siRNA"]},{"name":"ELISA（酶联免疫吸附）","en":"enzyme-linked immunosorbent assay","use":"定量测培养上清或血清里某个分泌蛋白，如焦亡放出的 IL-1β、IL-18，肝损伤时的炎症因子。","principle":"抗体把目标蛋白夹在板上（双抗夹心），酶催化底物显色，吸光度对标准曲线换算浓度。","steps":"收集上清/血清 → 加样孵育 → 洗板 → 显色 → 酶标仪读数 → 对标准曲线算浓度。","proves":"焦亡「放出去的东西」：细胞内 GSDMD-N 说打孔，ELISA 测到 IL-1β 真的分泌出来了，焦亡的炎症属性才完整。","note":"ELISA 测的是已分泌到外面的量，胞内前体多少它管不着；和 WB 的胞内条带是两个 compartment，别混读。","keys":["ELISA","IL-1β","炎症因子"]},{"name":"组织病理与血清生化（HE 染色 / ALT·AST）","en":"histopathology (H&E) & serum ALT/AST","use":"体内实验的「验收图」：HE 染色看肝肾组织结构坏没坏，血清 ALT/AST 看肝细胞漏酶程度。","principle":"HE 把细胞核染紫、胞质染粉，切片下看坏死、炎症浸润、脂肪变性；肝细胞受损后 ALT/AST 漏入血，酶活性与损伤程度正相关。","steps":"取组织固定包埋切片 → HE 染色镜检；另取血分离血清 → 试剂盒/生化仪测 ALT、AST。","proves":"动物层面的整体结论：机制链无论多完整，若组织未见损伤、转氨酶未升高，体内结论即不成立——体内外互证是课题组双模型的基本要求。","note":"病理图要有代表性视野和（最好）盲法评分；ALT/AST 是肝损伤的通用指标，不特异于某种死亡方式，别拿它区分焦亡凋亡。","keys":["HE","ALT","病理"]},{"name":"细胞培养、传代与冻存","en":"cell culture / passaging / cryopreservation","use":"一切体外实验的地基：把 AML-12、HepG2、NRK-52E 这些细胞养在状态里，该铺板时铺板、该冻存时冻存。状态不对，后面所有数据都白做。","principle":"细胞在 37°C、5% CO₂、含血清培养基里贴壁生长；密度太高会接触抑制、状态下滑，所以要在对数生长期按比例传代， surplus 的冻进液氮保种。","steps":"复苏 → 培养观察 → 80–90% 密度时胰酶消化传代 → 按实验密度计数铺板 → 多余细胞程序降温冻存。详细参数见下方 SOP。","proves":"它不直接证明机制，但决定其他一切证据可不可信：同一处理，细胞状态差一批、好一批，结果能完全相反。","note":"新手最容易忽略的三件事：支原体污染（看不见摸不着、毁数据于无形）、消化过度、铺板密度每批不一致。养成定期查支原体、定代次上限的习惯。","keys":["培养","传代","细胞系","AML-12","HepG2","NRK-52E"]},{"name":"免疫共沉淀 Co-IP","en":"co-immunoprecipitation","use":"验证两个蛋白在细胞里是不是「一伙的」——用一个蛋白的抗体把它和它的结合伙伴一起从裂解液里钓出来。","principle":"抗体结合目标蛋白，蛋白 A/G 珠子把抗体连人带伙伴一起拉下来；洗掉杂蛋白后跑 WB，用伙伴蛋白的抗体检测：能检到，说明两者在同一复合物里。","steps":"温和裂解 → 留 input → 抗体孵育过夜 → 珠子捕获 → 多次洗涤 → 煮样洗脱 → WB 检测伙伴蛋白。详细参数见下方 SOP。","proves":"「招募」「组装」「相互作用」类结论的落地证据：如 p62 招募 RIPK1 组装坏死体这类说法，靠的就是 Co-IP（或共定位）把两个蛋白钉在同一个复合物里。","note":"Co-IP 证明的是「在同一复合物」，不等于两蛋白直接接触（中间可能隔着别人）；结论措辞要留余地，最好再配反向 IP 或共定位互证。","keys":["Co-IP","共沉淀","招募","组装","相互作用"]}],"READOUTS":[{"method":"WB 条带：NLRP3、caspase-1 p20、GSDMD-N","proves":"这三条带变强，证明焦亡通路被激活；其中 GSDMD-N 是「已经切开、正在打孔」的直接证据，比只看总 GSDMD 硬。","keys":["焦亡","NLRP3","GSDMD"]},{"method":"LDH 释放 / PI 染色","proves":"证明细胞膜真的破了（焦亡、坏死性凋亡的共同结局）。蛋白条带说通路，LDH/PI 说膜破没破，两摞证据要分开看。","keys":["焦亡","坏死性凋亡","膜修复","膜破裂"]},{"method":"WB 条带：p-MLKL（磷酸化）","proves":"坏死性凋亡的激活证据是磷酸化的 p-MLKL，不是总 MLKL 的量。读这类图先找带 p- 的那条带。","keys":["MLKL","坏死性凋亡"]},{"method":"WB：cleaved-caspase-3、BAX/Bcl-2 比值；Annexin V 流式","proves":"凋亡的证据组合：执行者 caspase-3 被切活、促凋亡/抗凋亡比值升高、流式里磷脂酰丝氨酸外翻的细胞变多。","keys":["凋亡","BAX","caspase-3","Cyt-c"]},{"method":"GPX4↓ + ACSL4↑ + MDA↑ + GSH 耗竭","proves":"铁死亡的指标组合：防线（GPX4）塌、易感因子（ACSL4）升、脂质过氧化产物（MDA）堆积、还原储备（GSH）见底，几项要一起看。","keys":["铁死亡","GPX4","ACSL4"]},{"method":"C11-BODIPY 流式 / Fe²⁺ 荧光探针","proves":"分别直接看脂质 ROS 和游离铁——铁死亡链条里「过氧化」和「铁」两个要素的现场证据。","keys":["铁死亡","脂质过氧化","Fe²⁺"]},{"method":"LC3-II 与 p62 一升一降看自噬通量","proves":"LC3-II 升只说明自噬体多了，可能是造得多也可能是堵得排不掉；必须结合 p62（通畅时下降）和 CQ 阻断对照，才能判断通量是通是堵。","keys":["自噬"]},{"method":"线粒体—溶酶体共定位荧光 / mt-Keima / JC-1 膜电位","proves":"线粒体自噬的证据：看线粒体有没有真被送进溶酶体（共定位/Keima 变色），JC-1 则看线粒体膜电位这个「健康度」指标。","keys":["线粒体自噬"]},{"method":"LAMP-2A 条带 + PLIN2/3 降解","proves":"CMA 的证据组合：通道蛋白 LAMP-2A 的量，加上它的客户蛋白 PLIN2/3 被降解的速度——CMA 不看 LC3，别拿错指标。","keys":["CMA","LAMP-2A","PLIN"]},{"method":"油红 O / BODIPY 脂滴染色 + TG 定量","proves":"脂滴的形态证据（大小、数量分布）和总量证据（TG）是两回事：讲「抑制融合、拆小脂滴」的论文，形态图才是核心，TG 只是陪衬。","keys":["脂滴","脂质堆积","CIDEC"]},{"method":"DCFH-DA（总 ROS）/ MitoSOX（线粒体 ROS）荧光","proves":"荧光越亮 ROS 越多。分清探针：DCFH-DA 看全细胞，MitoSOX 专门看线粒体——链条写 mtROS 时，对应的应该是后者。","keys":["ROS","mtROS"]},{"method":"CTSB 荧光分布 / 溶酶体完整性染色（如 AO）","proves":"LMP 的证据：CTSB 从点状（困在溶酶体里）变成弥散（漏进胞质），或溶酶体酸性染色消失——证明膜真的漏了。","keys":["LMP","CTSB","溶酶体膜透化"]},{"method":"多时间点取样的表达曲线","proves":"节律论文的核心图不是某一条带，而是蛋白表达随昼夜涨落的曲线：看振幅还在不在、高峰有没有移位。只给单个时间点的，要打个问号。","keys":["节律","BMAL1","REV-ERB"]},{"method":"Nrf2 核蛋白 WB（入核）+ HO-1 等下游条带","proves":"Nrf2 的活性看「入核」而不是总量：核里多了、下游抗氧化蛋白起来了，才算抗氧化通路真的打开。","keys":["Nrf2"]},{"method":"GSDMD-N 与线粒体/组胺的共定位荧光","proves":"「易位」和「共定位」类结论的命根子图：两个荧光信号在显微镜下重合，才敢说打孔工真的去了线粒体、或和组胺待在一起。","keys":["易位","共定位","打孔"]}],"PITFALLS":[{"text":"焦亡 ≠ 凋亡：焦亡破膜、漏LDH、带炎症；凋亡打包、不漏、不发炎。caspase-1 管焦亡，caspase-3 管凋亡，别看混。","keys":["焦亡"]},{"text":"自噬不是永远保护：这篇里要看它在链里帮谁——反油酸篇自噬激活反而促焦亡，酸奶篇抑自噬反而保护。把「自噬=好」当铁律是读这组论文最大的坑。","keys":["自噬"]},{"text":"线粒体自噬的方向要看语境：危害物常压制它（坏线粒体清不掉→ROS 堆积），功能成分常激活它（清掉坏线粒体→ROS 下降）。同一个动作，毒理篇里是病因，保护篇里是药效。","keys":["线粒体自噬"]},{"text":"GPX4 下降 ≠ 铁死亡成立：还要有脂质过氧化升高和铁依赖证据（铁螯合剂或 ferrostatin-1 能把细胞救回来，才算钉死）。","keys":["铁死亡"]},{"text":"CMA 不是自噬的别名：CMA 走 LAMP-2A 单蛋白通道，不形成自噬体；LC3 变了不代表 CMA 变了，反过来也一样。","keys":["CMA"]},{"text":"p62 升高有两种读法：自噬堵住后的垃圾堆积，也可能是故意累积去激活 Nrf2（酸奶篇）。先看它下游接谁，再下结论。","keys":["p62"]},{"text":"节律「被扰乱」≠ 简单升高或降低：可能是振荡没了、相位移了。读图盯曲线形状，别只盯某个时间点的条带灰度。","keys":["节律","BMAL1","REV-ERB"]},{"text":"看到 MLKL 总量变化先别下结论：坏死性凋亡的激活证据是 p-MLKL（磷酸化条带）。","keys":["MLKL"]},{"text":"PANoptosis 不是「三种死亡都测到了」：关键是同一上游把三者整合调控，要看执行者易位线粒体这类串联证据、以及干预上游能同时压下多种死亡。","keys":["PANoptosis"]},{"text":"脂滴变少有两种完全不同的原因：生成少了，或清除快了（脂噬/CMA）。这篇走的是清除路线，别和「抑制合成」的论文混为一谈。","keys":["脂滴","脂噬","CIDEC"]}],"DEEP":{"10.1021/acs.jafc.5c17390":{"why":"微塑料已经在食物和饮用水里被检出，它会不会伤肝、怎么伤，是食品安全绕不开的问题。此前大多停留在「有毒性」，这篇要回答的是：它到底让肝细胞怎么死——结论不是一种死法，而是焦亡、铁死亡、凋亡被一条线串了起来。","steps":["聚苯乙烯微塑料颗粒是这条链的外来刺激源，相当于实验里的「投放物」。","线粒体先受伤：功能障碍让呼吸链漏出大量 mtROS——几乎所有毒理链的共同起点。","mtROS 点火 NLRP3 炎症小体，caspase-1 切开 GSDMD，GSDMD-N 在细胞膜打孔，焦亡启动。","关键新一步：GSDMD-N 不只打细胞膜，还跑到线粒体上打孔——这是这篇的「串联」发现。","线粒体被打孔后漏出更多 ROS，形成放大回路：越打越漏、越漏越打。","ROS 烧坏溶酶体膜（LMP），溶酶体里存的 Fe²⁺ 跟着漏出来。","Fe²⁺ 经 Fenton 反应催出脂质过氧化，膜被「锈穿」走向铁死亡；同时线粒体破损促 Cyt-c 释放。","Cyt-c 进入胞质启动凋亡。至此三种死亡被同一条链串完，这是它比上一篇苯并芘更进一步的地方。"],"design":"摘要未注明具体细胞系/动物，读原文时先去 Methods 把模型确认掉。设计逻辑看链条本身：作者没有停在「微塑料让细胞死了」，而是顺着死亡执行者 GSDMD-N 的去向追到线粒体——读图顺序就按这条链排：先线粒体功能与 mtROS，再焦亡蛋白条带，再看 GSDMD-N 与线粒体的共定位荧光，最后才是铁死亡与凋亡指标。","quiz":{"q":"如果用 MCC950 把 NLRP3 堵住，预期这条链会怎样？下游的铁死亡和凋亡还会发生吗？用自己的话说清理由。","a":"NLRP3 被堵 → caspase-1 不激活 → GSDMD-N 不产生，焦亡被截断；没有 GSDMD-N 去线粒体打孔，mtROS 放大回路、LMP—铁外流和 Cyt-c 释放都会跟着减弱，所以铁死亡和凋亡也会减轻。这正是这篇的核心论点：后两种死亡是被焦亡的执行者「带」出来的，不是微塑料平行地各打一份。"}},"10.1021/acs.jafc.5c15259":{"why":"苯并[a]芘是烧烤、烟熏食物和污染空气里的经典致癌物，它的肝毒性早就知道，但「同时点燃几种死亡、而且彼此串联」没讲清。这篇把焦亡、坏死性凋亡、凋亡打包成 PANoptosis 来解释：不是三件独立的事，是一个指挥部下的三支队伍。","steps":["BaP 进细胞后抬高 ROS，ROS 同时按下两个开关：NLRP3/GSDMD 点焦亡，RIPK1/RIPK3/p-MLKL 点坏死性凋亡。","两种打孔蛋白 GSDMD-N 和 p-MLKL 都易位到线粒体，把线粒体膜捅漏，Cyt-c 跟着释放出来。","Cyt-c 启动凋亡；三种死亡被同一上游（ROS+线粒体）整合，即 PANoptosis。"],"design":"体内外双模型：动物层面证明整体肝损伤，细胞层面拆机制。读的时候注意作者如何证明「整合」而非「并列」：关键证据是两种执行者都去了线粒体、且干预上游 ROS 能同时压下三种死亡——只测到三种死亡的指标，还不配叫 PANoptosis。","quiz":{"q":"如果只用 caspase-1 抑制剂挡住焦亡，坏死性凋亡和凋亡会消失吗？为什么？","a":"不会全消失。焦亡被挡，但 ROS 还在，RIPK1/RIPK3/p-MLKL 这条线照常走，p-MLKL 仍可易位线粒体促 Cyt-c 释放。所以凋亡和坏死性凋亡只会部分减轻——PANoptosis 是「同源分叉」，只堵一叉不够，要堵上游 ROS 或线粒体环节。"}},"10.1016/j.jhazmat.2024.133719":{"why":"亚硫酸盐是食品里常用的防腐护色剂（葡萄酒、干果里常见），过量摄入的肝风险需要机制解释。这篇问：它让肝细胞死时，是哪几种死法、谁先谁后、怎么串联——最后把三种死亡缝成了 PANoptosis，而缝合线是 p-MLKL。","steps":["亚硫酸钠灌胃 30 天，是模拟长期经口摄入的暴露方式——读毒理论文先看暴露方式像不像真实摄入。","mtROS 先升高：线粒体成为第一个受害者，兼「火源」。","ROS 同时点两条线：BAX/Bcl-2/caspase-3 走凋亡，RIPK1/RIPK3/p-MLKL 走坏死性凋亡。","p-MLKL 不只打细胞膜，还把溶酶体膜打漏（LMP）——这是它在这篇里的第二个身份。","溶酶体里的 CTSB 随之漏进胞质。","CTSB 激活 NLRP3，焦亡补位。于是凋亡、坏死性凋亡、焦亡被 p-MLKL 这一步串成 PANoptosis。"],"design":"C57BL/6 小鼠灌胃 30 天（体内、慢性暴露）+ AML-12 肝细胞（体外拆机制），是课题组的标准双模型配置。阅读时应注意 p-MLKL 的双重身份：它既是坏死性凋亡的执行者，又是触发 LMP 的上游——作者借此将三种死亡整合为一体，这也是判断「整合」的关键图。","quiz":{"q":"若在 AML-12 上敲低 MLKL，预期哪几种死亡受影响最大、哪种最小？说清链条上的理由。","a":"坏死性凋亡直接没了执行者，受影响最大；LMP 不发生 → CTSB 不漏 → NLRP3 焦亡也跟着哑火；凋亡走 BAX/caspase-3 这条相对独立的线，受影响最小。所以预期：坏死性凋亡和焦亡显著减轻，凋亡变化不大。"}},"10.1021/acs.jafc.3c06085":{"why":"同为亚硫酸钠：上一篇讨论其诱导 PANoptosis 的整体图景（面），本篇单独深入铁死亡一条线（点），并追问铁的来源。两篇对照阅读，可见课题组「先铺面、再钻点」的研究节奏。","steps":["亚硫酸钠进入肝细胞（小鼠+AML-12 双模型）。","mtROS 过量产生，氧化压力拉满。","ROS 烧漏溶酶体膜（溶酶体膜透化，LMP）。","溶酶体是细胞的「铁仓库」之一，膜漏后 Fe²⁺ 流出，与过氧化物发生 Fenton 反应。","脂质过氧化失控、膜被氧化烂穿，走向铁死亡。"],"design":"这条链的特色是给铁死亡找到了具体的铁来源：不是外源加铁，而是溶酶体漏铁。读图时重点看溶酶体完整性的证据（LMP）和 Fe²⁺ 探针荧光，以及 NAC 清掉 ROS 能否把全链压下去——能，就证明 ROS 在最上游。","quiz":{"q":"如果提前用铁螯合剂把游离 Fe²⁺ 螯合掉，mtROS 还会升高吗？铁死亡呢？","a":"mtROS 照常升高（它在上游，不依赖铁）；但 Fe²⁺ 被螯合后 Fenton 反应点不着，脂质过氧化链断掉，铁死亡应被显著挽救。这个对照能把「铁」钉死在因果链的中段——上游照常、下游消失，正是定位节点的方法。"}},"10.1016/j.fct.2023.114060":{"why":"反油酸是反式脂肪酸的代表（人造奶油、油炸食品），已知和代谢疾病相关。这篇问它伤肝的路径，出人意料的是：平时被当「保护系统」的自噬，在这里反而帮了倒忙——理解这篇，等于先破掉一个新手最容易抱死的直觉。","steps":["反油酸进入肝脏（小鼠+HepG2）。","自噬被异常激活——先注意：这里的自噬不是来救火的。","过度/异常的自噬过程牵连溶酶体，膜漏（LMP），CTSB 泄漏出来。","漏出的 CTSB 激活 NLRP3 炎症小体。","caspase-1/GSDMD 点火，肝细胞焦亡；原文注明抑制自噬反而能缓解——这是因果验证句，精读时要圈出来。"],"design":"这篇的读法重点就在「抑自噬可缓解」：作者做了抑制自噬的对照组，用「堵住某一步、表型消失」证明自噬在这条链里是因、不是伴随现象。读图时专门找抑制剂组与模型组的焦亡指标对比，那一组图决定全篇成不成立。","quiz":{"q":"在这篇里给细胞加自噬抑制剂，焦亡会加重还是减轻？这和「自噬是保护系统」的常识矛盾吗？","a":"减轻。不矛盾：自噬的角色取决于语境——这条链里异常激活的自噬牵连溶酶体漏酶，是焦亡的帮凶。把「自噬 = 保护」当铁律，正是读这组论文最容易踩的坑；永远先问「自噬在这条链里替谁干活」。"}},"10.1016/j.fct.2024.114525":{"why":"3-MCPD 酯是精炼植物油里产生的加工危害物，吃油就躲不开。这篇只用 HepG2 一个细胞模型，把它引出的坏死性凋亡链拆干净，重点在线粒体怎么先坏掉——链条短，正好适合练「顺链读图」。","steps":["3-MCPD 酯作用于 HepG2（人肝癌细胞系，课题组常用的人源肝模型）。","经 CTSB/TFAM 通路搞坏线粒体：TFAM 管线粒体 DNA 的维护，它出问题，线粒体就残了。","坏线粒体漏出过量 ROS。","ROS 激活 RIPK1/RIPK3/MLKL，走向坏死性凋亡。"],"design":"纯体外单细胞模型，胜在链条干净。读的时候看作者如何把「线粒体功能障碍」量化（膜电位、TFAM 条带），还有一个细节：CTSB 在这里出现在链的上游（伤线粒体），与它在焦亡链里当 NLRP3 信使的位置不同——同物不同位，正是枢纽视角的价值。","quiz":{"q":"若预先用 NAC 清除 ROS，p-MLKL 还会升高吗？这说明 ROS 在链中处于什么位置？","a":"不会（或显著降低）。ROS 在 MLKL 的上游：堵住 ROS，下游坏死性凋亡点不着火。这类「清上游、看下游」的验证，是整组论文最常用的因果套路，读每篇都可以先找它。"}},"10.1016/j.fct.2023.113918":{"why":"焦亚硫酸钠是食品漂白/防腐剂，也和过敏反应有关。这篇换了个细胞——肥大细胞（过敏反应的主角），问它为什么会让肥大细胞一边焦亡、一边脱颗粒放组胺，把「毒性」和「致敏」接成一条线。","steps":["焦亚硫酸钠作用于肥大细胞——模型选角决定了这篇的问题是致敏，不只是毒性。","它先抑制线粒体自噬：坏线粒体清不掉。","坏线粒体堆积，mtROS 升高。","mtROS 激活 NLRP3/GSDMD-N 焦亡；同时 GSDMD 孔与组胺颗粒共定位，等于给组胺开了出口，脱颗粒（过敏）随之发生。"],"design":"模型选肥大细胞是这篇的设计眼：换靶细胞就换出新问题。读图重点是 GSDMD 与组胺的共定位荧光——这是把「焦亡」和「脱颗粒」钉在一起的关键图；没有这张图，标题里两个现象就只是并列关系。","quiz":{"q":"如果想办法恢复线粒体自噬，脱颗粒会减轻吗？为什么？","a":"会。链条顺序是：线粒体自噬受抑 → mtROS↑ → 焦亡与脱颗粒。把最上游的自噬恢复，坏线粒体被清掉，mtROS 降下来，后面的焦亡和组胺释放都会跟着减弱——干预点越靠上游，压住的下游越多。"}},"10.1016/j.scitotenv.2025.178852":{"why":"缩水甘油同属油脂加工危害物家族（与 3-MCPD 同源），这篇看它的肾毒性。切入点很特别：不是线粒体先坏，而是自噬先被堵住，垃圾蛋白 p62 堆积闯了祸——p62 在这篇里从「指标」变成了「凶手」。","steps":["缩水甘油进入肾（小鼠+NRK-52E 大鼠肾细胞）。","自噬被阻断：本该被降解的 p62 异常聚集——垃圾清运停摆。","堆积的 p62 反手招募 RIPK1，组装坏死体（RIPK1/RIPK3/MLKL）引发坏死性凋亡；同时 NF-κB 被激活促炎。"],"design":"读这篇要抓住 p62 的双面性：它平时是判断自噬通畅与否的指标（被降解 = 通畅），这里却成了行凶者（聚集 = 招募 RIPK1）。对照酸奶篇里 p62 累积激活 Nrf2 的保护作用，三篇带 p62 的论文连起来读，最能体会「节点无善恶、看下游接谁」。","quiz":{"q":"若敲低 p62，缩水甘油引起的坏死性凋亡会怎样？其他后果也会一起消失吗？","a":"坏死性凋亡会减轻：p62 是这条链的中段枢纽，没有 p62 聚集，RIPK1 招募不到，坏死体组装不起来。但自噬本身仍被堵着，NF-κB 炎症等其他后果未必同步消失——敲掉一个节点，只断它下游的那条线。"}},"10.1021/acs.jafc.5c07992":{"why":"黄曲霉毒素 B1 是花生、玉米发霉产生的强致癌物，肝之外肾也受害。这篇问它在肾里怎么让细胞死，亮点是 GSDMD-N 被线粒体膜上的心磷脂「招募」过去打孔——和微塑料篇的线粒体打孔遥相呼应，两篇是同一枢纽的两种招募方式。","steps":["AFB1 进入肾（体内外双模型）。","先坏线粒体自噬：受损线粒体清不掉。","ROS 随之升高。","ROS 引发 LMP，CTSB 漏出。","CTSB 激活 NLRP3，焦亡启动，产生 GSDMD-N。","关键步：线粒体内膜特有的心磷脂翻出来，像「停机坪」一样把 GSDMD-N 招募到线粒体上打孔。","线粒体破孔，漏出 Cyt-c。","Cyt-c 启动一条非经典凋亡——焦亡的执行者顺手点着了凋亡，这就是标题里的「串扰」。"],"design":"与微塑料篇对照读：两篇都有「GSDMD-N 上线粒体打孔 → Cyt-c → 凋亡」，但招募机制不同（这里是心磷脂招募）。读图重点是 GSDMD-N 与线粒体/心磷脂的共定位证据——共定位图就是「招募」这个动词的全部证据。","quiz":{"q":"如果抑制 caspase-1，Cyt-c 释放还会发生吗？为什么这能证明「串扰」？","a":"基本不会。Cyt-c 释放依赖 GSDMD-N 先在线粒体打孔，而 GSDMD-N 来自 caspase-1 的切割。堵住 caspase-1，等于同时关掉焦亡和这条「非经典凋亡」——凋亡在这里不是独立发生的，而是挂在焦亡执行者后面的，这正是「串扰」的证据。"}},"10.1021/acs.jafc.4c01994":{"why":"还是 3-MCPD，这次看肾。作者盯上一个平时不起眼的系统——ESCRT-III 膜修复队，看它被抑制后为什么焦亡会「双重加重」：一边坏线粒体清不掉，一边膜破了没人修。一篇里讲清一个节点的两副面孔。","steps":["3-MCPD 进入肾细胞。","它抑制 ESCRT-III，而 ESCRT-III 平时参与线粒体自噬的正常运转。","线粒体自噬被拖垮，受损线粒体与 ROS 堆积起来。","ROS 激活 NLRP3，走向焦亡。","雪上加霜：GSDMD 在细胞膜打的孔本可被 ESCRT-III 修补，现在修复队也被抑制，孔修不上，焦亡更重——一抑双害。"],"design":"这篇的设计精髓是「一个节点、两种后果」。读的时候把证据分成两摞：一摞证明 ESCRT-III 与线粒体自噬的关系，一摞证明膜修复失败（膜完整性、LDH 类指标），两摞合起来才是完整故事。和辣椒素篇对照，那边是激活 ESCRT-III 修膜治病，正反面正好凑齐。","quiz":{"q":"若过表达 CHMP4B（ESCRT-III 关键成员）把修复队救回来，预期哪些环节会改善？","a":"两个环节同时改善：上游——线粒体自噬恢复，ROS 下降，NLRP3 激活减弱；下游——膜孔修补恢复，LDH 释放减少。所以焦亡应被明显挽救，而且是从因和果两头同时挽救，这是这篇链条的标志性预测。"}},"10.1021/acs.jafc.4c05676":{"why":"1,3-DCP 是氯丙醇家族的另一员。这篇把「生物钟」引入肾毒理：如果管节律的 BMAL1 被扰乱，抗铁死亡的 GPX4 没了节律性表达，肾细胞会不会特别容易铁死亡？它回答的是一个「时间维度」的毒理问题。","steps":["1,3-DCP 作用于 NRK-52E——只用一个肾细胞模型，把变量控制到最简。","它扰乱 BMAL1，生物钟的核心发条。","BMAL1 乱了，下游 GPX4 的节律性表达被压：该高的时候高不起来，铁稳态也跟着乱。","脂质过氧化没人拦，越积越多。","膜被脂质过氧化烧穿，肾细胞铁死亡。"],"design":"节律论文的读图要点在这一篇练：GPX4 不能只看一个时间点的条带高低，要看它「该涨的时候涨不涨得起来」的节律曲线。这篇是线二（肾毒理）与节律专题的交叉口，★标记提示横向关联阅读——它和 BMAL1/SIRT3 那篇是同一上游、不同下游。","quiz":{"q":"若过表达 BMAL1 把节律扳回来，GPX4 和铁死亡会怎样？这类实验在节律论文里起什么作用？","a":"GPX4 的节律性表达恢复，脂质过氧化重新被拦住，铁死亡减轻。「过表达救援」是节律线论文的标准因果证据：把被扰乱的发条强行扳正，表型跟着恢复，才能说毒性是经这个节律节点实现的（对照 3-MCPD 的 BMAL1/SIRT3 篇，套路完全一致）。"}},"10.1021/acs.jafc.3c04358":{"why":"3-MCPD 的肾损伤再往上游追：它的第一靶点可能不是某个死亡蛋白，而是生物钟本身。这篇问 BMAL1 被干扰后，它管着的抗氧化线 SIRT3/SOD2 怎么跟着垮、线粒体怎么受伤——它停在「线粒体损伤」，是给后面铁死亡篇留接口的一篇。","steps":["3-MCPD 进入肾（小鼠肾+NRK-52E）。","BMAL1 表达及其下游 SIRT3/SOD2 的日节律被干扰——不是简单的升或降，是「点儿乱了」。","SIRT3/SOD2 通路受抑：SOD2 是线粒体里清超氧自由基的主力，它弱了，ROS 就没人管。","肾细胞线粒体损伤；原文注明过表达 BMAL1 可逆转——因果闭环的锚点句。"],"design":"体内取肾组织看节律、体外 NRK-52E 做过表达救援，分工典型。读时注意作者取样是否分时间点——节律研究如果只取一个时间点，结论要打折。这篇的链条故意收在「线粒体损伤」，下游接哪种死亡，交给同组的其他论文（比如 BMAL1/GPX4 铁死亡篇）去接。","quiz":{"q":"为什么这篇只做到「线粒体损伤」就收尾，没有继续写某种细胞死亡？这说明课题组的论文是什么关系？","a":"链条长短取决于作者划定的问题边界：这篇回答的是「节律紊乱如何伤线粒体」，死亡是再下游的事。它给后来的铁死亡篇（BMAL1/GPX4）留了接口——课题组的论文即如此逐篇衔接，阅读时应将其视为一张网络，而非 26 篇孤立的文章。"}},"10.1016/j.cbi.2026.112175":{"why":"又是反油酸：线一里它在肝里点焦亡，这篇换了战场——它让肝长脂肪。路径很绕：先动一条 lncRNA，再经 miRNA 和 SNX10，最后拆掉 CMA 的通道蛋白 LAMP-2A。读它最练「长链条耐心」，每一环都要问一句凭什么。","steps":["反油酸进入肝细胞。","lncRNA GAS5 像海绵一样吸附 miR-27b-3p，把这个「静音键」吸走。","miR-27b-3p 被吸走，它原本压制的 SNX10 就升起来了。","SNX10 促进 CTSA 成熟，CTSA 去降解 LAMP-2A——CMA 的门被拆了。","CMA 受损：本该被 CMA 拆掉包被的脂滴处理不了。","肝脂质堆积；原文注明 CMA 激活剂 QX77 可缓解——全篇的救援锚点。"],"design":"这是全组调控链最长的一篇（RNA 层 → 蛋白层 → 细胞器层 → 表型）。读法：每往下一层，问一句「作者用什么证明这一步」——吸附关系、蛋白条带、激活剂救援各管一段。QX77 救援是因果锚点：如果最下游把 CMA 强行打开就能救回表型，说明整条链确实汇到 CMA 上。","quiz":{"q":"用 CMA 激活剂 QX77 处理，脂滴会变多还是变少？它作用在链的哪一段，为什么这能证明链条成立？","a":"变少。QX77 作用在最下游的 CMA 环节：不管上游 GAS5 / miR-27b-3p / SNX10 怎么折腾，只要 CMA 功能被强行拉回来，脂滴包被就能继续拆解、脂质堆积被缓解。这叫「下游救援」——能被最下游单独救回，说明链条是汇聚到这个节点的真链条，而不是几件互不相干的事。"}},"10.1021/acs.jafc.6c08297":{"why":"芹菜素是芹菜等蔬菜里的黄酮，这篇是保护线：它治脂肪肝（NAFLD）的办法不是直接溶脂，而是先把大脂滴「拆小」——小脂滴才容易被脂噬吃掉。先解决尺寸，再谈清除，顺序感是这篇的灵魂。","steps":["芹菜素作为干预物登场（注意：在这篇里它是药，不是毒——读保护线先分清谁打谁）。","经 AKT-FHL2/PPARγ 这条信号轴，把 CIDEC 的表达压下去。","CIDEC 是让小脂滴融合成大脂滴的「融合工」，它少了，脂滴保持小个头、不再融合长大。","小脂滴表面积相对大、包被易处理，更容易被脂噬降解，脂肪被清掉。"],"design":"摘要未注明模型，读原文时先补这一课。这篇的巧思在「以尺寸换清除效率」，读图重点看脂滴形态（大小分布）而不只是总量——只测 TG 总量会错过这篇的核心证据，因为它的主张恰恰是「总量变化之前，尺寸先变了」。","quiz":{"q":"若强行过表达 CIDEC，芹菜素的减脂效果会被抵消吗？为什么？","a":"会被抵消大半。芹菜素的链是「压 CIDEC → 脂滴不融合 → 易脂噬」，强制升高 CIDEC 相当于恢复链条中段，脂滴重新增大、脂噬效率下降。这正是这类论文会用（或应预期）的因果验证：把被压的节点顶回去，药效消失，链条成立。"}},"10.1021/acs.jafc.5c07933":{"why":"1,3-DCP 在线二中致肾铁死亡，在肝中则经另一条链：扰乱节律蛋白 REV-ERBα，使自噬节律紊乱，脂滴清除受阻而堆积。同一危害物、不同器官、不同机制链，对照阅读最能体现课题组「一物多篇」的布局。","steps":["1,3-DCP 进入肝细胞。","它扰乱节律并上调 REV-ERBα——生物钟的「刹车」被踩过头。","自噬相关蛋白的节律表达乱套，自噬功能受损（不是没了，是不合拍了）。","自噬清脂滴的效率下降，脂滴堆积；原文注明沉默 REV-ERBα 可缓解——救援锚点。"],"design":"读节律论文的通法在这里再练一次：结论落在「节律紊乱」而非某个蛋白的表达量。沉默 REV-ERBα 的救援组是因果锚点：把被上调的节点压回去，表型消失，链就成立。这与 BMAL1 篇是镜像：一篇是发条被压，一篇是刹车被踩。","quiz":{"q":"沉默 REV-ERBα 后自噬恢复，脂滴会怎样？这一步证明了什么？","a":"脂滴堆积缓解。它证明 REV-ERBα 上调不是伴随现象，而是链条的必经中段：1,3-DCP 是经它才搞坏自噬的。凡是「把某个升高的节点敲低、表型就消失」的设计，都是在把相关性升级为因果性。"}},"10.1021/acs.jafc.4c06487":{"why":"漆黄素也是黄酮类功能成分。这篇把节律拉进保护线：高脂饮食先把肝的生物钟搞乱，它再把 BMAL1 扶起来，顺带解决脂滴——「治钟」来「治脂」，是线三里交叉色彩最浓的一篇。","steps":["漆黄素干预 HFD/FFA 造成的脂肪肝（C57BL/6 小鼠+AML-12）。","它上调 BMAL1，改善被高脂搞乱的节律。","BMAL1 正常了，CIDEC 介导的脂滴融合被抑制——注意 CIDEC 又出现，和芹菜素脂噬篇是同一个节点、不同上游。","脂滴保持小尺寸。","小脂滴易被脂噬清除，脂质堆积缓解。"],"design":"这篇是「节律 × 脂滴」的交叉样本，读时横向对照两篇：芹菜素经 AKT 轴压 CIDEC，漆黄素经 BMAL1 压 CIDEC——殊途同归，说明 CIDEC 是课题组认定的减脂关键节点。同一节点被两篇从不同上游打中，这种复现正是「枢纽」二字的分量。","quiz":{"q":"若敲低 BMAL1，漆黄素还能压住 CIDEC 吗？这验证的是什么？","a":"不能（或大幅减弱）。漆黄素的链是「升 BMAL1 → 抑 CIDEC」，BMAL1 被敲低等于把链的第一环拆了，下游 CIDEC 和脂滴都不会再响应。这验证的是「上游依赖性」：药效必须经它宣称的第一个节点实现，不是碰巧。"}},"10.1021/acs.jafc.4c08430":{"why":"芹菜素第三次登场，这次走 CMA：它不直接碰脂滴，而是先激活能量感受器 AMPK，再经 PLIN2 磷酸化和 Nrf2，把 CMA 的通道 LAMP-2A 升起来，加速拆脂滴的包被。和反油酸拆 LAMP-2A 的那篇正好一正一反。","steps":["芹菜素干预 HFD 小鼠+肝细胞。","激活 AMPK——细胞的「电量计」兼代谢总调度。","AMPK 往下做两件事：让 PLIN2 磷酸化（给脂滴包被打上待拆标记）、促 Nrf2 入核。","LAMP-2A 升高，CMA 通道变多、火力增强。","CMA 把脂滴包被 PLIN2/3 拆掉——油罐的壳没了。","失去保护壳的脂滴被降解，脂肪减少。"],"design":"对照反油酸 CMA 篇读最划算：那边拆 LAMP-2A 致病，这边升 LAMP-2A 治病——同一个节点两个方向，是理解 CMA 最快的办法。读图抓两样：LAMP-2A 条带（通道）和 PLIN2 的下降（客户被处理）。","quiz":{"q":"若敲低 LAMP-2A，芹菜素的降脂作用还在吗？为什么？","a":"基本不在。芹菜素的链条终点是 CMA，而 LAMP-2A 是 CMA 的唯一通道；通道没了，上游 AMPK、Nrf2 再活跃，蛋白也送不进溶酶体降解，PLIN2 拆不掉，脂滴降解停摆。这叫「终点节点不可绕过」。"}},"10.1039/d2fo02719d":{"why":"人参皂苷 Rb1 是人参的标志成分。这篇它在脂肪肝里当「自噬总调度」：通过压住一个 miRNA，放行转录因子 TFEB，让溶酶体和自噬装备整体升级，再去降脂——一级压一级，最后放大成整套系统的升级。","steps":["Rb1 干预 HFD 小鼠+HepG2 的脂肪堆积。","它抑制 miR-128——一个平时压着 TFEB 的「静音键」。","miR-128 松了，TFEB 的转录和入核都增加。","TFEB 入核后批量打开溶酶体相关基因，自噬流整体增强。","自噬性脂质降解加速，肝里的脂肪被清掉。"],"design":"TFEB 是课题组的常驻枢纽：这篇在肝里用它降脂，Rb1 肾焦亡篇在肾里用它搞线粒体自噬抗焦亡。读时注意「miRNA → 转录因子 → 一整套基因」的三级放大结构——这也是干预单个 miRNA 即可影响整个自噬系统的原因。","quiz":{"q":"若过表达 miR-128 把 TFEB 再压回去，Rb1 的自噬增强还剩多少？","a":"大半会被抵消。Rb1 是「先松 miR-128 才放行 TFEB」，把 miR-128 强行加回去，等于重新锁上 TFEB 的入口，溶酶体基因上不来，自噬流和降脂效果一起回落。这验证了 miR-128 在这条链里是真开关，不是旁观者。"}},"10.1016/j.fct.2023.113670":{"why":"1,3-DCP 第三次登场：这次在肝里，它不碰死亡，专拆「燃脂开关」——压住 BMAL1，PPARα 跟着下降，负责拆解脂肪的两种脂肪酶被关停，脂滴只进不出、堆起来。这篇和 REV-ERBα 篇是节律伤肝的两个镜像。","steps":["1,3-DCP 进入肝（小鼠肝+HepG2）。","抑制 BMAL1，节律的第一环被按住。","PPARα 跟着下降——它是脂肪酸氧化的总开关。","中性脂肪酶 ATGL、HSL 受抑：脂滴里的脂肪没人拆解外运。","脂滴堆积；原文注明 BMAL1 过表达或 PPARα 激活剂可逆转——注意它给了两个救援点。"],"design":"这篇给了两个救援点（上游 BMAL1 过表达、下游 PPARα 激活剂），读图时对比两组救援的完整度，能判断链条是否还有旁路。与 REV-ERBα 篇同为节律伤肝：一压发条（BMAL1），一踩刹车（REV-ERBα），合起来是节律线在肝里的完整图景。","quiz":{"q":"用 PPARα 激活剂能绕过 BMAL1 被抑制吗？为什么？这叫什么救援？","a":"能。PPARα 在 BMAL1 的下游，激活剂直接把下游开关打开，不需要 BMAL1 点头，ATGL/HSL 就能恢复、脂滴减少。这叫「下游绕行救援」——同时也反证了链条顺序确实是 BMAL1 → PPARα，而不是反过来。"}},"10.3168/jds.2024-26233":{"why":"这篇最「食品」：酸奶缓解急性酒精性肝损伤，有效成分指向它的代谢物 D-乳酸。机制出人意料——它靠「抑制自噬」来保护。又一篇打破「自噬 = 好」直觉的论文，而且它和反油酸篇构成完美对照：一个抑自噬治病，一个自噬激活致病。","steps":["主角其实是酸奶的代谢物 D-乳酸，不是酸奶本身——先分清「食物」和「有效成分」。","D-乳酸抑制自噬（先记住：在这条链里，抑自噬是保护动作）。","自噬被抑，本该被降解的 p62 累积起来。","堆积的 p62 走非经典路线激活 Nrf2——细胞的抗氧化总开关。","Nrf2 开足抗氧化，ROS 下降。","NLRP3 炎症小体失去 ROS 燃料，被压制。","肝细胞焦亡与炎症一起缓解，保护成立。"],"design":"这篇和缩水甘油篇构成 p62 的对照组：那边 p62 聚集招募 RIPK1 行凶，这边 p62 累积激活 Nrf2 救人——p62 是中性工具，干什么取决于下游接谁。读时重点看作者怎么证明「抑自噬 → p62 → Nrf2」的顺序（时序变化与敲低/抑制对照），顺序错了，整个故事就反了。","quiz":{"q":"若敲低 Nrf2，D-乳酸的抗焦亡作用还在吗？为什么？","a":"大半消失。D-乳酸的保护力来自「p62 累积 → Nrf2 抗氧化 → ROS↓ → NLRP3 抑」，敲掉 Nrf2，p62 累积再多也接不通抗氧化，ROS 压不下去，NLRP3 照样点火，焦亡会回来。这说明 Nrf2 是这条保护链的必经站，不是装饰。"}},"10.1021/acs.jafc.4c12425":{"why":"乳铁蛋白是牛奶里的铁结合蛋白。这篇它对抗 LPS（细菌内毒素）引起的肝损伤，办法是加速线粒体自噬：把被 LPS 打坏的线粒体及时清走，不让 ROS 和坏死性凋亡滚雪球。是保护线最标准的一条链，还附带一个教科书级的逆转实验。","steps":["乳铁蛋白干预 LPS 损伤的肝细胞——先分清：它是保护方，LPS 是损伤方。","它促进线粒体自噬，专门清 LPS 打坏的线粒体。","坏线粒体清走，ROS 随之下降。","ROS-RIPK1-RIPK3 这条坏死性凋亡线被压住，氧化应激缓解；原文注明线粒体自噬抑制剂 CsA 可逆转这一保护——锚点证据。"],"design":"CsA 逆转是全篇的因果锚：把「促线粒体自噬」这一环堵上，保护作用随之消失，说明保护正是经这一环实现的。读所有保护线论文都先找这类「逆转句」——没有逆转实验的保护机制，都只是相关性讲故事。","quiz":{"q":"加了 CsA 后乳铁蛋白还保护得了吗？这个实验设计想证明什么？","a":"保护不了。CsA 抑制线粒体自噬，等于把乳铁蛋白的作用环节掐断；保护作用随之消失，就证明乳铁蛋白不是泛泛抗氧化，而是必须经「线粒体自噬 → 清坏线粒体 → 降 ROS」这条具体路径起效。凡是保护线论文，都该有这样一手。"}},"10.3168/jds.2023-24490":{"why":"还是乳铁蛋白，换个战场：急性酒精性肝损伤。这次它不用线粒体自噬，而是亮出自己的本行——管铁：把铁的进出账本理顺，让酒精点不着铁死亡。全组只有这一篇从「铁的来源管理」下手。","steps":["乳铁蛋白预防给药，对抗酒精（AML-12+小鼠，体内外酒精模型）。","它螯合铁并重整铁代谢蛋白：进口的 TFR、DMT1 降，出口的 FPN 和储铁的 FTH 升——进少、出多、存好。","铁过载被缓解，游离铁减少。","没有过量铁催化，酒精诱导的铁死亡被抑制（ACSL4↓、GPX4↑ 是判定指标）。"],"design":"读铁死亡论文先认指标组合：GPX4 回升 + ACSL4 下降 + 铁过载缓解，三件套齐了链才闭环。这篇与亚硫酸钠篇（溶酶体漏铁）构成铁来源对照：一个是「仓库漏铁」，一个是「账本管铁」——同样是铁死亡，铁的来路完全不同。","quiz":{"q":"若外加过量铁剂把铁过载强行造回来，乳铁蛋白的保护会被冲掉吗？为什么？","a":"会被冲掉大半。因为它的保护机制就是「把铁管住」，外源铁绕过它的调控重新造成过载，Fenton 反应和脂质过氧化会重新点着，铁死亡指标（ACSL4↑、GPX4↓）随之反弹。这类「把病因加回去」的实验，是对机制最直接的压力测试。"}},"10.1016/j.fct.2024.114522":{"why":"Rb1 从肝（降脂）转战肾：对抗 3-MCPD 的肾焦亡。它用的还是 TFEB 这张牌——促 TFEB 入核，点亮线粒体自噬，清掉 3-MCPD 打坏的线粒体，从源头断掉焦亡的燃料。一篇典型的「毒理篇配保护篇」组合。","steps":["Rb1 干预 3-MCPD 损伤（ICR 小鼠+NRK-52E）。","促 TFEB 表达与入核——溶酶体/自噬的总开关被打开。","线粒体自噬被激活，受损线粒体被及时清走。","坏线粒体没了，ROS 下降。","NLRP3 激活失去燃料，肾细胞焦亡缓解。"],"design":"与 3-MCPD 肾焦亡原篇（ESCRT-III 篇）对照阅读收益最大：原篇是「3-MCPD 抑制线粒体自噬致病」，这篇是「Rb1 激活线粒体自噬治病」，同一节点正反两面。课题组的保护线大多这样和毒理线配对出现——找到配对关系，即可同时理解两篇。","quiz":{"q":"若用 CsA 抑制线粒体自噬，Rb1 还能抗焦亡吗？为什么？","a":"不能（或大幅减弱）。Rb1 的链是「TFEB → 线粒体自噬 → 清坏线粒体 → ROS↓ → NLRP3 抑」，CsA 阻断中段的线粒体自噬后，TFEB 入核亦无法落实，ROS 不能下降，焦亡会重新升高。与乳铁蛋白 LPS 篇的 CsA 验证逻辑完全相同——这是课题组反复用的验证句式。"}},"10.1039/d4fo00806e":{"why":"辣椒素治酒精性肝焦亡的思路最「外科」：焦亡的本质是膜被打孔，那它就去修膜。它激活辣椒素受体 TRPV1，引钙内流，召唤 ESCRT-III 修补队把膜孔封上——不拦上游，专修下游，是全组思路最不一样的一篇。","steps":["辣椒素干预急性酒精损伤的肝细胞。","激活 TRPV1——辣椒素的专属受体（吃辣发热就是它在报警）。","TRPV1 打开，Ca²⁺ 内流——钙信号在这里是「召集修补队」的警报。","ESCRT-III 膜修复机器被诱导集结到破损处。","它把焦亡打出的膜破裂修好，细胞不胀破，焦亡被缓解。"],"design":"与 3-MCPD 肾篇对照：那边 ESCRT-III 被抑制致病，这边被激活治病，同一枢纽正反面。读图重点是膜完整性类证据（LDH、PI）和 ESCRT-III 成员的募集情况——「修膜」这个主张，必须有膜真的被修好的证据撑着，而不只是某个蛋白表达变多。","quiz":{"q":"若敲低 CHMP4B（ESCRT-III 关键成员），辣椒素的保护还在吗？为什么？","a":"基本不在。辣椒素的链终点是 ESCRT-III 修膜，CHMP4B 被敲低，修补队缺了主力，Ca²⁺ 信号再强也修不上膜孔，焦亡照样发生。这也说明这篇的保护不靠压上游信号，而是靠终点执行环节——敲终点，整条链作废。"}},"10.1039/d2fo03130b":{"why":"Rb1 的第三篇：ConA（刀豆蛋白 A）诱导的是免疫性肝损伤。这篇它走经典的 PINK1/Parkin 线粒体自噬路线保护肝细胞，是课题组「线粒体自噬—ROS—NLRP3」标准链的范本，应先精读此范本，其他保护篇多为其变体。","steps":["Rb1 干预 ConA 肝损伤模型。","激活 PINK1/Parkin 线粒体自噬——坏线粒体的「点名清除」系统：PINK1 在坏线粒体上点名，Parkin 来贴标签。","被点名的受损线粒体被清走。","ROS 随之下降。","NLRP3 炎症小体失去 ROS 燃料，被压制住。","肝细胞焦亡缓解。"],"design":"这篇适合当保护线的「模板篇」精读：链条是课题组复现最多的「促线粒体自噬 → ROS↓ → NLRP3↓」。精读此篇后，再读芹菜素 HFD 篇、Rb1 肾篇，结构即可一目了然——区别只在损伤模型和点亮自噬的手法（这里是 PINK1/Parkin，那里是 TFEB）。","quiz":{"q":"若敲低 PINK1，Rb1 的抗焦亡作用会怎样？为什么 Parkin 也会跟着失灵？","a":"会显著减弱。PINK1 是这条线粒体自噬路线的点名员：它先停在坏线粒体上，Parkin 才被招募过来贴标签。PINK1 缺位，Parkin 无从下手，坏线粒体清不掉，ROS 和 NLRP3 都压不下去——Rb1 的作用环节被拆除，保护随之落空。"}},"10.1021/acs.jafc.2c07581":{"why":"芹菜素的第一篇（2023）：高脂饮食/棕榈酸诱导肝细胞焦亡，芹菜素起保护作用。走的是课题组最经典的那条链——线粒体自噬、ROS、CTSB、NLRP3，作者甚至把通路名字直接写进了结论。适合当整组保护线的入门篇。","steps":["芹菜素干预 HFD/棕榈酸损伤（C57BL/6J 小鼠+AML-12）。","促线粒体自噬：把棕榈酸打坏的线粒体清掉。","ROS 下降——先把火源灭掉，后面的连锁反应才停得下来。","溶酶体膜不再被烧漏（LMP 减少），CTSB 泄漏随之减少。","没有 CTSB 点火，NLRP3 焦亡通路被整条抑制——原文把这条链直接命名为「线粒体自噬—ROS—CTSB—NLRP3」。"],"design":"这篇的链条被作者自己写进结论里，是全组「通路命名」的范例。读法：把它当模板，之后每读一篇保护线论文，先问一句「它是不是这条链的变体、变在哪一环」——乳铁蛋白 LPS 篇换了终点（坏死性凋亡），酸奶篇换了起点（抑自噬），骨架都是它。","quiz":{"q":"若加 CA-074Me 抑制 CTSB，芹菜素组与模型组的焦亡差距会变大还是变小？这个结果反过来证明什么？","a":"变小。CTSB 位于链条中段，模型组中其本处于致病环节，加入抑制剂相当于预先阻断该环，模型组的焦亡亦会下降，两组差距被压缩。这反过来证明 CTSB 确为该链的必经节点——节点越关键，外源干预越能模拟上游药物的效果。"}}},"PROTOCOLS":{"Western Blot（蛋白免疫印迹）":{"materials":["试剂：RIPA 裂解液、蛋白酶抑制剂、磷酸酶抑制剂、BCA 定量试剂盒、上样缓冲液（loading buffer）、预制胶或配胶试剂、电泳液、转膜液、甲醇、PVDF 膜（或 NC 膜）、TBST、封闭液（5% 脱脂奶粉或 5% BSA）、一抗、二抗、ECL 发光液","器材：低温离心机、金属浴/水浴锅、电泳槽、电源、转膜槽、摇床、化学发光成像仪、剪刀镊子"],"steps":[{"do":"收样裂解：细胞用预冷 PBS 洗 1 次，加含蛋白酶+磷酸酶抑制剂的 RIPA（现用现加），冰上裂解 30 min，期间轻晃几次；组织按重量加 RIPA 后匀浆。","why":"把蛋白溶出来，同时冻住酶的活性——抑制剂不加，目标蛋白会被降解，磷酸化蛋白（p-MLKL 等）会脱磷酸，条带直接消失。"},{"do":"离心取上清：4°C、12,000×g 离心 15 min，小心吸上清到新管，别带沉淀。","why":"沉淀是不溶的膜碎片和核酸，带进去会让条带拖尾、变形。"},{"do":"BCA 定量：按试剂盒说明书做标准曲线测各样本浓度，再用 RIPA 把所有样本调成同一浓度。","why":"各组上样总蛋白量一致，条带强弱差异才代表真实表达差异，而不是谁加得多。"},{"do":"变性：样本加 1/4 体积 5× 上样缓冲液，95–100°C 煮 5 min，冰上冷却后短暂离心。（多聚体/膜蛋白可改 70°C 10 min。）","why":"SDS 让蛋白带上均匀负电、展开成线，按分子量大小分离；煮不够会残留结构、跑出怪带。"},{"do":"电泳：每孔上样 20–40 μg，两侧孔加预染 Marker；先 80 V 约 30 min 让样本压齐进分离胶，再 120 V 跑到溴酚蓝接近胶底（总时长约 1–1.5 h）。","why":"低压进胶条带齐，高压分离快；Marker 是后面判断分子量和转膜成败的参照。"},{"do":"转膜：PVDF 膜先在甲醇里活化 15–30 秒，再泡转膜液；按「负极—海绵—滤纸—胶—膜—滤纸—海绵—正极」夹好赶尽气泡，湿转常用 300 mA 恒流 1–2 h 或 100 V 1 h，全程冰浴或 4°C。","why":"把胶里的蛋白原位搬到膜上固定下来；气泡处转不过去会留下空白斑，电流产热不过冷会糊带。"},{"do":"封闭：转完把膜放 5% 脱脂奶粉（测磷酸化蛋白改用 5% BSA），室温摇床 1 h。","why":"先用便宜蛋白占满膜上的空白位点，抗体就没地方乱粘，背景才干净。奶粉本身含磷酸化蛋白，会抬磷酸化抗体的背景，所以要换 BSA。"},{"do":"孵一抗：按说明书稀释（常见 1:500–1:2000），4°C 摇床孵育过夜（约 12–16 h）。","why":"低温慢结合，特异性最好；一夜的时间让低丰度蛋白也结合充分。"},{"do":"洗膜+孵二抗：TBST 洗 3 次、每次 5–10 min；二抗室温孵育 1 h；再 TBST 洗 3 次。","why":"洗掉没结合上的抗体是降背景的决定步，次数和时间偷工，整张膜都会发灰。"},{"do":"显影：ECL 发光液现配，均匀滴在膜上反应约 1 min，放进成像仪，从短曝光（数秒）到长曝光连拍几张。","why":"强带先饱和、弱带要长曝光才出来，多拍才能挑到一张所有带都在线性范围内的图做定量。"}],"controls":["整张膜没带：先看预染 Marker 有没有转上膜——没转上是转膜问题（膜没活化、夹反、没赶气泡）；转上了没带，多半是一抗失效、二抗种属不匹配或样本本身没表达。","背景黑、全膜发花：一抗太浓、封闭不足、洗膜偷工，或曝光过头；先加洗、降一抗浓度、换短曝光排查。","磷酸化蛋白测不到：裂解时漏加磷酸酶抑制剂，或用了奶粉封闭——这两条是最高频原因。","条带歪斜、笑脸形（中间快两边慢）：上样量不齐、电泳产热不均；降电压、把样本孔居中排布可缓解。","内参各条不等：定量或加样不准，这批数据不能归一化，先别急着解释目标带。"],"readout":"判读顺序：先核分子量对不对（切割带如 GSDMD-N 约 31 kDa、caspase-1 p20 约 20 kDa，要出现在更低的位置）→ 再看内参齐不齐 → 最后才比目标带灰度。定量必须用未饱和曝光的图，灰度对内参归一化后再组间比较。"},"qPCR（实时荧光定量 PCR）":{"materials":["试剂：RNA 提取试剂（Trizol 或柱式提取试剂盒）、氯仿/异丙醇/75% 乙醇（Trizol 法）、反转录试剂盒（含去基因组 DNA 步骤）、SYBR Green 预混液、目标与内参基因引物、DEPC 水","器材：qPCR 仪、八联管或 96 孔板、微量离心机、核酸定量仪（NanoDrop 等）、全程无 RNA 酶的枪头管子"],"steps":[{"do":"提 RNA：样本加 Trizol 充分裂解（或用柱式试剂盒），按说明书分层/过柱，最后用 DEPC 水溶解；动作要快、样本别反复冻融。","why":"RNA 极易被环境中的 RNA 酶降解，提取慢一步、污染一点，Ct 值就全乱。"},{"do":"验 RNA 质量：测浓度，A260/280 在 1.8–2.1 之间算合格，太低说明有蛋白/酚污染。","why":"质量不合格的 RNA 反转录效率不稳，后面倍数变化全是噪声。"},{"do":"去基因组 DNA + 反转录：按试剂盒先做 gDNA 去除，再取等量 RNA（常用 1 μg）反转录成 cDNA。","why":"残留基因组 DNA 会被一起扩增出假信号；各样本 RNA 起始量一致，反转录产物才可比。"},{"do":"配反应体系：每孔 SYBR 预混液 + 引物（终浓度常用 0.2–0.4 μM）+ 稀释 cDNA + 水到 10–20 μL；每个样本每个基因做 3 个复孔，另设无模板对照（NTC）。","why":"复孔是给移液误差留的保险；NTC 有扩增说明体系被污染或引物二聚体严重，整板作废。"},{"do":"上机程序：95°C 预变性 30 秒–10 min（按预混液要求）；40 个循环：95°C 5–15 秒变性、60°C 30 秒退火延伸；结束后跑熔解曲线（65→95°C 逐步升温）。","why":"熔解曲线是产物身份证：单一峰才是单一产物，双峰多半是引物二聚体或非特异扩增。"},{"do":"算结果：先查复孔 Ct 差（应 <0.5）、熔解曲线单峰，再用 2^-ΔΔCt 法：样本 Ct 先减内参 Ct（ΔCt），再减对照组 ΔCt（ΔΔCt），取负指数得相对表达倍数。","why":"内参校正掉上样量差异，对照组校正掉基线，最后剩下的才是处理真正的效应。"}],"controls":["熔解曲线双峰/杂峰：引物二聚体或非特异扩增——提高退火温度、降引物浓度，仍不行就换引物。","NTC 也有 Ct：体系污染（水、预混液、环境 DNA），全换新试剂重配。","复孔 Ct 差 >0.5：移液不准或孔内有气泡，配体系时用总管混匀分装，别逐孔手加微量组分。","Ct >35：模板太少或基因本来低表达，这个数不可信，浓缩 cDNA 或换高表达样本验证。","内参随处理明显变化：说明该内参在本模型中不稳定，应更换内参或采用两个内参取均值，不宜强行计算。"],"readout":"报告倍数变化前先自查三件事：熔解曲线单峰、NTC 干净、复孔齐。解读时记住 qPCR 测的是 mRNA；和 WB 蛋白结果不一致时不是谁错了，可能是翻译/降解层面的调控，分开写清。"},"免疫荧光与共定位（激光共聚焦）":{"materials":["试剂：4% 多聚甲醛（PFA）、PBS、Triton X-100、封闭液（5% BSA 或山羊血清）、一抗、荧光二抗（波段互不重叠，如 488/594/647）、DAPI、抗荧光淬灭封片剂","器材：共聚焦专用玻璃底小皿或细胞爬片、24 孔板、湿盒、激光共聚焦显微镜"],"steps":[{"do":"铺细胞：把爬片放进 24 孔板（或直接用玻璃底小皿），接种细胞，染色当天密度控制在 50–70%。","why":"太满细胞叠层、信号互相遮挡；太稀找不到视野——共定位定量对密度很敏感。"},{"do":"处理与固定：按实验设计处理后，PBS 轻洗 1 次，4% PFA 室温固定 15 min，PBS 洗 3 次。","why":"把蛋白原位冻住，后面所有染色都在这个位置关系上进行；固定过久会掩盖抗原表位、信号变弱。"},{"do":"透化：0.1–0.25% Triton X-100 室温 10 min，PBS 洗 3 次。（只染细胞膜表面蛋白可跳过这步。）","why":"在膜上打小孔，抗体才进得去染胞内蛋白；但透化也会把膜结构洗散，膜蛋白实验要谨慎。"},{"do":"封闭：5% BSA 或与二抗同源的血清室温封闭 30–60 min。","why":"堵住非特异结合位点，降背景——和 WB 封闭一个道理。"},{"do":"孵一抗：按说明书稀释，滴在爬片上（湿盒防干），4°C 孵育过夜。","why":"低温过夜结合更特异；湿盒是防样本干掉——干过的片子整片报废。"},{"do":"洗 + 孵荧光二抗：PBS 洗 3 次×5 min；荧光二抗室温避光孵育 1 h；再洗 3 次。全程避光。","why":"荧光怕光，见光久了会淬灭，拍照时信号就弱了。"},{"do":"染核封片：DAPI 室温 5 min，水洗，滴抗淬灭封片剂封片，避光保存，尽快拍照。","why":"DAPI 给细胞核定位，是判断信号在核内/胞质/膜上的参照坐标。"},{"do":"拍照：共聚焦下先定好激光强度、增益、针孔，各组全程同一套参数；每组随机拍多个视野（常用 ≥5 个），别挑最好看的。","why":"参数中途一变，组间亮度就没法比；挑视野是这类图最常见的可信度杀手。"},{"do":"共定位分析：用 ImageJ 等软件算两通道的 Pearson 相关系数或重叠系数，统计多视野均值。","why":"「共定位」是定量结论不是观感——没有系数的叠加图只能算示意图。"}],"controls":["两通道互相串色（绿的漏进红通道）：荧光波段选太近或激光太强——做单染对照检查串色，必要时顺序扫描。","全片背景高：封闭不足、一抗太浓或洗不干净；先降一抗浓度、延长洗涤。","信号几乎为零：一抗与样本种属不反应、固定过度、目标蛋白本身低表达；先在阳性样本上验证抗体。","CTSB 判读假弥散：透化过强会把溶酶体内容物人为放出来，LMP 实验的透化条件要先摸索并固定。","边缘荧光特别亮：爬片边缘干过或抗体聚集，拍照避开边缘区域。"],"readout":"先看单通道再看叠加：定位结论（如 GSDMD-N 上线粒体）要有共定位系数和统计；CTSB/LMP 看点状变弥散的细胞比例；所有定量都应来自同一参数拍摄的随机多视野。"},"流式细胞术":{"materials":["试剂：Annexin V-FITC/PI 检测试剂盒（含结合缓冲液）、PBS、无 EDTA 的胰酶（或温和消化液）、补偿用单染样本","器材：流式细胞仪、流式上样管、40 μm 细胞筛网、低温离心机"],"steps":[{"do":"收细胞：先把培养上清收集起来（漂浮的凋亡细胞都在里面），再用无 EDTA 胰酶轻柔消化贴壁细胞，两部分合并。","why":"只收贴壁细胞等于把死得最厉害的那批扔了，凋亡率会被系统性低估；EDTA 会干扰 Annexin V 与膜的结合，所以要用无 EDTA 的消化液。"},{"do":"洗涤：300×g 离心 5 min 收集，预冷 PBS 洗 2 次。","why":"洗掉血清和残留消化液，血清蛋白会影响染色。"},{"do":"重悬：用结合缓冲液把细胞调到约 1×10⁶ 个/mL，取 100 μL 到流式管。","why":"结合缓冲液里的 Ca²⁺ 是 Annexin V 结合膜上磷脂酰丝氨酸的必需条件，普通 PBS 替代不了。"},{"do":"染色：加 Annexin V-FITC 5 μL、PI 5 μL（按试剂盒），轻混，室温避光孵育 15 min，再补 400 μL 结合缓冲液。","why":"Annexin V 标记外翻的磷脂酰丝氨酸（凋亡早期信号），PI 只能进膜破的细胞——两者组合才能分早期凋亡、晚期凋亡和坏死。"},{"do":"上机前准备：先跑未染管调电压，再用单染管做荧光补偿；样本过 40 μm 筛网防堵针。染色后 1 h 内测完。","why":"没补偿，两通道荧光互相串，象限全是错的；拖太久 PI 会慢慢渗进活细胞，假阳性升高。"},{"do":"分析设门：先圈出主细胞群（去掉碎片），再看四象限——双阴性=活细胞，Annexin V+/PI−=早期凋亡，双阳性=晚期凋亡/继发性坏死，Annexin V−/PI+=机械损伤或原发坏死。","why":"门的画法决定数字，门要画在对照组上定死，再套到所有组，别逐组挪门。"}],"controls":["对照组凋亡率就异常高：消化过度或离心太猛把膜弄伤了——缩短消化、轻柔吹打、降低离心力。","象限斜着飘、补偿后仍乱：补偿样本太弱或电压太高，重做单染、降电压。","PI 单阳很多：多半是收集/消化造成的机械损伤，不全是坏死，结合 LDH 和形态一起判断。","上机堵管：细胞成团没过筛，或密度太高——过筛、稀释、加少量 DNase（死细胞多的样本）。"],"readout":"报凋亡率要写清口径：总凋亡率=早期+晚期。流式是「比例证据」，凋亡的定性还要有 cleaved-caspase-3 的 WB 条带互证，两个对上再写进结论。"},"ROS 荧光探针（DCFH-DA / MitoSOX）":{"materials":["试剂：DCFH-DA 探针、MitoSOX 探针、无血清培养基、PBS、阳性对照诱导剂（如试剂盒自带 Rosup，或实验室现行阳性对照）","器材：荧光显微镜或流式细胞仪、避光孵育盒、黑壁透明底 96 孔板（如用酶标仪/成像）"],"steps":[{"do":"稀释探针：用无血清培养基把 DCFH-DA 稀释到常用 10 μM、MitoSOX 稀释到常用 5 μM（以说明书为准），现配现用、全程避光。","why":"探针见光和久置都会自氧化，没进细胞就发亮，背景会淹没真信号；血清会干扰探针加载，所以用无血清培养基。"},{"do":"加载：去掉含药培养基，加入稀释好的探针覆盖细胞，37°C 避光孵育 20–30 min。","why":"探针要先进细胞被酯酶切开『锁住』，再被 ROS 氧化才发光；时间不够加载不充分，太久探针会外排或产生毒性。"},{"do":"洗涤：无血清培养基洗 3 次，洗净没进细胞的探针。","why":"残留探针在胞外被氧化发光，是背景高的头号来源。"},{"do":"平行设阳性对照：单独一组用阳性诱导剂短时处理后同法染色。","why":"阳性对照证明探针和仪器都工作正常——阴性结果才敢信；没有它，『没信号』分不清是没 ROS 还是实验失败。"},{"do":"立即检测：荧光拍照（各组同一曝光）或消化收集上流式测平均荧光强度（MFI）。染色后别久等。","why":"荧光会随时间消退、探针会继续氧化，拖得越久组间越不可比。"}],"controls":["对照组背景就很高：探针久置见光自氧化，或洗涤不足——现配、避光、洗够 3 次。","荧光强弱和细胞密度强相关：各组铺板密度必须一致，定量时按细胞数或蛋白量校正。","用 DCFH-DA 就下 mtROS 结论：它测的是全细胞总 ROS，特异性也有限；链条写 mtROS 必须对应 MitoSOX 的数据。","阳性对照也不亮：探针失效或仪器通道不对，先别测正式样本。"],"readout":"报各组 MFI 相对对照的倍数变化；拍照图只作展示，定量以流式或统一曝光下的灰度统计为准。ROS 是几乎所有毒理链的起点，这一步的可信度决定整条链——阳性对照和 NAC 回落实验齐了再下结论。"},"JC-1 线粒体膜电位":{"materials":["试剂：JC-1 检测试剂盒（含 JC-1 染液与洗涤缓冲液）、完全培养基、阳性对照药 CCCP","器材：荧光显微镜或流式细胞仪、CO₂ 培养箱"],"steps":[{"do":"配工作液：按试剂盒说明书把 JC-1 稀释成工作液（常见用法是储存液按比例加入培养基或缓冲液），现配现用、避光。","why":"JC-1 易沉淀、怕光，工作液状态直接决定染色均匀度。"},{"do":"设阳性对照：单独一组加 CCCP（常用 10 μM）处理 10–20 min。","why":"CCCP 强制把膜电位打塌，这组应该几乎全绿——用于验证染色体系与红绿判读标准无误。"},{"do":"染色：弃培养基（或直接向培养基加工作液，按说明书路线），37°C 避光孵育约 20 min。","why":"膜电位高时 JC-1 在线粒体内聚集成红色聚合物，电位低时散成绿色单体，孵育是让它按电位分布到位。"},{"do":"洗涤：用试剂盒洗涤缓冲液洗 2 次，加培养基或缓冲液保持湿润。","why":"洗掉胞外游离染料，不然满视野都是假信号。"},{"do":"检测：荧光拍照（红、绿双通道，同一参数）或流式双通道采集，算每组红/绿荧光比值。","why":"单看红色变弱可能是细胞变少了；红/绿比值才把『电位』和『细胞量』分开。"}],"controls":["全视野都红、CCCP 组也不绿：染液浓度太高或孵育太久，聚合物非特异堆积——降浓度、缩时间。","红绿都弱：细胞密度太低或染料失效；先加密度和阳性对照排查。","各组细胞密度不一致：比值会被带偏，铺板和处理时长必须统一。","拍照挑电位好的区域：随机多视野，定量优先用流式比值。"],"readout":"报告红/绿比值相对对照的变化幅度。膜电位下降是『线粒体受损』的信号但可逆，别直接等同于细胞死亡；要和 ROS、线粒体自噬、死亡指标连起来读。"},"透射电镜 TEM":{"materials":["试剂：2.5% 戊二醛固定液、磷酸盐缓冲液、四氧化锇（后固定，剧毒，通风橱操作）、梯度乙醇、丙酮、包埋树脂、醋酸双氧铀、柠檬酸铅","器材：超薄切片机、铜网、透射电镜、恒温聚合箱"],"steps":[{"do":"取材固定要快：组织离体后 1 分钟内切成约 1 mm³ 小块投入戊二醛；贴壁细胞可原位固定后刮下离心成团。4°C 固定 2 h–过夜。","why":"超微结构死后几分钟就开始自溶变形，取材慢一步，看到的『线粒体肿胀』可能全是假象。"},{"do":"后固定：缓冲液洗 3 次，四氧化锇固定 1–2 h（通风橱、避光）。","why":"锇酸固定脂质、增强膜的对比度——自噬体的双层膜、线粒体嵴全靠它显形。"},{"do":"脱水：50%→70%→80%→90%→100% 乙醇梯度，每级约 10–15 min，再过丙酮。","why":"水和包埋树脂不相溶，必须逐步把水换干净，跳级会让组织收缩变形。"},{"do":"浸透包埋：树脂与丙酮混合液逐步浸透，纯树脂包埋，60°C 聚合 24–48 h。","why":"样本要硬得能切成几十纳米的薄片，聚合不完全切片会碎、会皱。"},{"do":"切片：先切半薄片定位（找细胞富集区），再切 60–80 nm 超薄片，捞到铜网上。","why":"电镜视野极小，先定位再超薄切，命中率和代表性都高得多。"},{"do":"双染：醋酸双氧铀染约 10–20 min，水洗；柠檬酸铅再染约 10–20 min，水洗晾干。","why":"铀铅给蛋白和核酸上『影』，没有染色超微结构几乎没对比度可看。"},{"do":"观察拍照：低倍找完整细胞，高倍看线粒体（嵴、肿胀、空泡）、自噬体（双层膜包裹胞质成分）、自噬溶酶体、脂滴；每组拍多个细胞（常用 ≥10 个）做计数统计。","why":"电镜最有说服力也最容易以偏概全——单张图的结论必须有多视野计数兜底。"}],"controls":["线粒体全肿胀、嵴全消失：先怀疑取材/固定（太慢、固定液渗透不到中心），别急着写成处理效应——对照组同批固定就是用来排除这个的。","数到的『自噬体』其实是空泡或切面假象：判定标准是双层膜+胞质样内容物，单层膜空泡、内质网切面都不算。","切片皱褶、破裂：刀钝或聚合不全，换刀口、查聚合条件。","只拍最典型的细胞：代表性崩塌，计数时要按随机视野规则执行。"],"readout":"定量指标一般是：自噬体/自噬溶酶体每细胞个数、损伤线粒体比例、脂滴面积。注意自噬体变多有两种解释（生成多或降解堵），必须结合 LC3-II/p62 的 WB 才能判通量方向。"},"LDH 释放 / PI 染色（膜完整性）":{"materials":["试剂：LDH 检测试剂盒（含反应液与裂解液）、PI 染液、无血清或低血清培养基","器材：酶标仪（490 nm 附近）、96 孔板、低温离心机、荧光显微镜（PI 法）"],"steps":[{"do":"提前设好三种对照孔：背景孔（只有培养基）、低对照（未处理细胞，自然释放）、高对照（未处理细胞，测前约 45 min 加试剂盒裂解液，人为全释放）。","why":"释放率是相对量：没有高对照这个『100% 破膜』锚点，吸光度数字本身没有意义。"},{"do":"收上清：处理结束后取培养上清，离心（如 300×g 5 min 或按说明书）去掉漂浮细胞和碎片，转入新板。","why":"上清里混着活细胞会在反应中继续漏 LDH，把读数抬虚高。"},{"do":"加反应液：上清与 LDH 反应工作液按说明书比例混合，室温避光孵育约 30 min（以说明书为准）。","why":"LDH 催化底物显色，强度与上清里 LDH 量成正比；超时显色会饱和、组间差被压没。"},{"do":"读数：酶标仪 490 nm（或试剂盒指定波长）测吸光度，按公式算释放率：（样本−低对照）/（高对照−低对照）×100%。","why":"扣掉自然释放、锚定全释放，剩下的才是处理造成的破膜比例。"},{"do":"PI 法（替代/补充）：活细胞直接加 PI（常用 1–5 μg/mL），室温避光 5–15 min，不洗或轻洗后立即拍照/流式计数阳性率。","why":"PI 进不了完好细胞膜，只染膜破的细胞核——是『破膜』最直观的现场图；拖久了 PI 对细胞本身有毒，会自己造阳性。"}],"controls":["血清自带 LDH 背景高：收样前换低血清/无血清培养基培养一段时间，或务必扣背景孔。","低对照释放率就很高：细胞状态差或收样吹打太狠，先解决细胞状态再谈处理效应。","拿 LDH 单独证明焦亡：破膜是焦亡、坏死性凋亡、机械损伤的共同终点——死法的定性必须靠 GSDMD-N、p-MLKL 等条带，LDH 只负责证明『膜真破了』。"],"readout":"报告释放率（%）或 PI 阳性率，与对照组比。解读时和通路蛋白条带分工写清：条带说哪条通路被激活，LDH/PI 说膜的结局，两份证据都齐，破膜型死亡的结论才完整。"},"CCK-8 / MTT 细胞活力":{"materials":["试剂：CCK-8 试剂（或 MTT+ DMSO）、完全培养基、无菌 PBS","器材：96 孔板、多通道移液器、CO₂ 培养箱、酶标仪（450 nm，MTT 为 490/570 nm 附近）"],"steps":[{"do":"铺板：消化计数后按每孔约 5×10³–1×10⁴ 个细胞、100 μL 接种 96 孔板（按细胞大小和实验总时长调整）；最外圈孔加 PBS 或培养基不种细胞。","why":"密度决定处理时细胞处于对数期还是已经挤爆；边缘孔蒸发快、读数漂，围一圈液体能保湿抗蒸发。"},{"do":"贴壁过夜：37°C、5% CO₂ 培养约 12–24 h，让细胞贴牢、恢复状态。","why":"刚消化的细胞状态未稳就加药，毒性会被放大且批间差异大。"},{"do":"加药处理：换含药培养基（注意留无药对照、溶剂对照），按设计时长处理（如 24 h）。","why":"溶剂（如 DMSO）本身有剂量毒性，没有溶剂对照，分不清死于药还是溶剂。"},{"do":"加 CCK-8：每孔加 10 μL（培养基体积的 1/10），轻晃混匀，37°C 继续孵育 1–4 h，盯着对照孔变橙、吸光度到约 0.8–1.2 时停。","why":"活细胞脱氢酶把试剂还原成橙色产物，颜色深浅≈活细胞量；孵育过头全部饱和，组间差异被压平——这是 CCK-8 最常见的翻车点。"},{"do":"读数：酶标仪 450 nm 测吸光度（可设 650 nm 参比波长）；读前检查并戳破气泡。存活率=（处理孔−空白孔）/（对照孔−空白孔）×100%。","why":"空白孔（只有培养基+试剂）扣掉的是试剂本底，不扣的话低存活组会被系统性抬高。"},{"do":"MTT 路线差异：加 MTT 后孵育约 4 h，弃上清，每孔加 150 μL DMSO 振荡溶解紫色结晶，再读数。","why":"MTT 的产物不溶于水，必须溶出来才能测；这一步麻烦且 DMSO 会溶板底，所以现在多用 CCK-8 替代。"}],"controls":["药物本身带颜色或有还原性：会直接干扰显色——必须设『无细胞+药+试剂』孔验证，干扰大的药换检测方法（如直接计数）。","同组复孔差很多：铺板时细胞悬液沉降导致越铺越浓——铺板中途多次混匀、用排枪，是基本功。","对照孔吸光度过低：细胞太少或孵育太短；过高（>2）：密度/孵育过度已饱和，两头都要回调。","拿活力下降直接当死亡结论：CCK-8 测的是代谢活力，抑制线粒体代谢的药会假性拉低读数——要配 LDH/PI 或流式确认。"],"readout":"先画剂量—效应曲线，挑存活率约 50–80% 的剂量做后续机制实验（全死或没反应的剂量都拆不了机制）；保护实验看『模型组掉多少、干预组拉回多少』，并用 LDH/流式复核不是代谢假象。"},"脂滴染色与 TG 定量（油红 O / BODIPY）":{"materials":["试剂：油红 O 储备液（异丙醇配制）、4% PFA、60% 异丙醇、苏木素（可选）、水性封片剂（甘油明胶）、BODIPY 493/503、TG 检测试剂盒","器材：冰冻切片机（组织样本）、荧光/普通显微镜、酶标仪、ImageJ"],"steps":[{"do":"样本准备：细胞爬片直接用；组织必须用冰冻切片——石蜡切片的脱水透明流程会把脂滴溶掉，先确认样本类型对不对。","why":"油红 O 染的是脂本身，样本处理把脂弄没了，后面染得再好也是假阴性。"},{"do":"固定：4% PFA 室温固定 10–30 min，水洗。","why":"固定保住细胞形态和脂滴位置；过度固定会让脂滴轮廓变形。"},{"do":"平衡：60% 异丙醇浸润约 30 秒–1 min。","why":"让样本环境和染液溶剂一致，染料只进脂滴、不在水相里乱沉淀。"},{"do":"染色：油红 O 工作液（储备液与水按说明书比例稀释、过滤后用）室温避光染 10–20 min。","why":"染液必须现配现过滤——析出的染料颗粒落在片子上和脂滴长得一模一样，是经典假阳性。"},{"do":"分化洗涤：60% 异丙醇快速涮洗数秒去背景，立即水洗停住。","why":"分化是手感活：洗少了满片红、洗多了脂滴也被带走，先拿预实验片摸时间。"},{"do":"（可选）苏木素复染核 1–2 min，水洗返蓝；水性封片剂封片拍照。切记不用二甲苯和中性树胶。","why":"有机溶剂封片会把刚染上的脂滴再溶掉，整张片白做。"},{"do":"BODIPY 路线：活细胞或固定后样本加 BODIPY 493/503 工作液（常用约 1–2 μg/mL，以说明书为准）避光染 15–30 min，洗涤，DAPI 染核，共聚焦拍照，用 ImageJ 统计脂滴数量与粒径分布。","why":"BODIPY 能给出单个脂滴的大小分布——『抑制融合、拆小脂滴』这类结论只有它能证明，油红 O 和 TG 都给不了粒径。"},{"do":"TG 定量：另取平行样本裂解，按 TG 试剂盒（酶法）显色读数，结果对总蛋白量归一化（μg TG/mg 蛋白）。","why":"形态是『长什么样』，TG 是『总共有多少』，两个维度分开测、分开报。"}],"controls":["满片红色颗粒分不清脂滴：染液没过滤或太旧——现配、过滤、设无脂对照。","脂滴被洗没了：分化过度或用了有机溶剂封片，全程盯紧这两步。","拿 TG 没降否定『拆小脂滴』机制：CIDEC 被抑时先变的是粒径分布，总量短期可不变——问题问的是形态就看形态图。","组织脂肪变性判读：石蜡 HE 上看到的是脂滴被溶掉后的空泡，不是脂滴本体，措辞要分清。"],"readout":"报告三件事：脂滴数量、粒径分布（形态）、TG 总量。结论引用哪一维就出哪一维的图；形态与总量方向不一致时，回到这篇的机制问题（融合/清除/合成）解释，别硬凑一致。"},"铁死亡指标组合（C11-BODIPY / Fe²⁺ / MDA / GSH）":{"materials":["试剂：C11-BODIPY 581/591 探针、FerroOrange 等 Fe²⁺ 探针、MDA 检测试剂盒、GSH 检测试剂盒、Fer-1 与铁螯合剂（去铁胺 DFO）作挽救组","器材：流式细胞仪、荧光显微镜、酶标仪、水浴锅（MDA 显色需加热）"],"steps":[{"do":"先排好组：除对照/模型/干预外，务必平行设 Fer-1 挽救组（如常用 1–2 μM 预处理，浓度以预实验为准），有条件再加 DFO 组。","why":"挽救组是铁死亡的『验收章』：没有它，前面测的都只是相关性指标，结论下不了。"},{"do":"C11-BODIPY 测脂质 ROS：处理结束后活细胞加载探针（常用 2–5 μM）37°C 避光 30 min，洗 2 次，立即上流式，看荧光由红向绿移的比例/强度。","why":"探针插在膜脂里，被脂质过氧化物氧化才变色——它测的正是铁死亡烧的那把火；必须活细胞、尽快测，放久了自发氧化。"},{"do":"Fe²⁺ 探针：活细胞加载 FerroOrange（常用约 1 μM）37°C 30 min，洗涤后拍照或流式。","why":"游离 Fe²⁺ 是 Fenton 反应的燃料，这一步证明『铁』这一角在场。"},{"do":"MDA 与 GSH 试剂盒：平行样本裂解取上清——MDA 多用 TBA 法（酸性加热显色后读 532 nm 附近），GSH 用 DTNB 法；都按说明书并做标准曲线，对蛋白量归一化。","why":"MDA 是脂质过氧化的终产物（火烧过的痕迹），GSH 是抗氧化储备（水还剩多少），两者是试剂盒路线的互补证据。"},{"do":"同批留样跑 WB：GPX4、ACSL4（必要时加 FTH1、TFR1 等铁代谢蛋白）。","why":"防线蛋白的变化要和功能指标同批对应，隔批样本的比较说服力打折。"},{"do":"汇总四角证据再下结论：脂质 ROS↑、Fe²⁺↑、GPX4↓/GSH↓、Fer-1 可挽救——四项齐了才写铁死亡成立。","why":"铁死亡没有单一金指标，国际共识就是拼图式判定，缺角就在讨论里如实写缺哪角。"}],"controls":["只凭 GPX4 下降宣布铁死亡：这是精读时第一个要挑的毛病，缺脂质过氧化和挽救证据一律按『疑似』处理。","MDA 特异性有限（糖类等也能显色）：必须和 C11-BODIPY 互证，别单独用它撑结论。","C11-BODIPY 拖到下午才测：自发氧化抬背景，挽救组和模型组都糊成一团——活细胞探针实验要卡时间点。","Fer-1 溶剂毒性：Fer-1 用 DMSO 配制，挽救组要带等量溶剂对照。"],"readout":"按『铁—过氧化—防线—挽救』四格逐格打勾汇报。读别人的铁死亡图也用同一张清单：哪格空着，结论强度就降一档。"},"溶酶体完整性与 CTSB 分布（AO 染色等）":{"materials":["试剂：吖啶橙（AO）、LysoTracker 探针、CTSB 抗体与荧光二抗（走免疫荧光路线时）、CA-074Me（抑制对照）","器材：荧光显微镜/共聚焦、活细胞成像皿"],"steps":[{"do":"AO 活细胞染色：处理结束后加 AO（常用约 5 μg/mL）37°C 避光 15 min，洗 1–2 次立即拍照。","why":"AO 聚集在酸性完好溶酶体里发红光，溶酶体漏了、酸性丢了就变绿而弥散——红/绿形态就是 LMP 的现场读数；AO 有光毒性，拍要快。"},{"do":"或用 LysoTracker：活细胞加载（常用 50–100 nM）37°C 30 min，直接活细胞成像，不要固定后再看。","why":"LysoTracker 依赖溶酶体酸性环境蓄积，固定会破坏酸性、信号全丢——顺序错了实验就白做。"},{"do":"CTSB 分布（免疫荧光路线）：固定、透化后按免疫荧光 SOP 染 CTSB，看荧光形态是点状（困在溶酶体内）还是弥散（漏进胞质），统计弥散细胞比例。","why":"LMP 的关键证据是 CTSB『搬家』而不是总量变化——WB 总量不变恰恰是这条链的特点，只测条带会整段错过。"},{"do":"设因果对照：平行加 CA-074Me 抑制 CTSB，看下游 NLRP3/焦亡指标是否回落。","why":"形态证据说『漏了』，抑制剂证据说『漏出来的 CTSB 就是点火者』，两份证据合起来这条桥才算钉死。"}],"controls":["透化过强造假弥散：做 CTSB 分布时透化条件要先摸索固定，处理组和对照组条件必须完全一致。","AO 拍照太慢：光毒性会现场诱导溶酶体破裂，后拍的视野全是被自己照漏的——限时、限视野数、低光强。","LysoTracker 信号消失就断言溶酶体全漏：也可能是探针加载失败或细胞状态差，用 AO 或 CTSB 分布复核一条。"],"readout":"报告弥散型细胞比例或红/绿荧光比的组间差异，并和下游焦亡指标（GSDMD-N、IL-1β）同向验证；CTSB 总量 WB 只作背景交代，不作 LMP 证据。"},"siRNA 敲低 / 过表达（遗传学验证）":{"materials":["试剂：目标基因 siRNA 与阴性对照 siRNA（NC）、过表达质粒与空载体、脂质体转染试剂（如 Lipofectamine 系列）、无血清培养基（Opti-MEM）、无抗生素培养基","器材：各规格孔板、CO₂ 培养箱；后续验证用 qPCR/WB 全套"],"steps":[{"do":"提前一天铺板：转染当天细胞密度达到 60–80%（siRNA 可略低），用无抗生素培养基培养。","why":"密度太高转染效率掉、太低细胞扛不住转染毒性；抗生素在转染时进细胞增多，会放大毒性假象。"},{"do":"配复合物：siRNA（终浓度常用 20–50 nM）或质粒（按板规格，如 24 孔约 0.5 μg/孔）与转染试剂分别用 Opti-MEM 稀释，各孵育 5 min 后混合，再室温孵育 15–20 min。具体比例以转染试剂说明书为准。","why":"脂质体要先把核酸包成复合物才进得去细胞；比例和孵育时间不对，效率直接腰斩。"},{"do":"转染：把复合物逐滴加到孔里，轻晃混匀，放回培养箱；4–6 h 后视毒性换回完全培养基。","why":"逐滴慢加防局部浓度过高毒死一片；换液时机是效率与毒性的平衡点。"},{"do":"必设对照：阴性对照 siRNA/空载体组、只加转染试剂组、未处理组，三组一个不能少。","why":"表型变化可能来自转染本身而不是目标基因——没有 NC 对照则无法排除。"},{"do":"验效率再做实验：24 h 左右 qPCR 验 mRNA 敲低，48–72 h WB 验蛋白下降（过表达反之）；敲低效率常用 ≥70% 才算达标。","why":"没验效率就测表型，阴性结果分不清是『基因不重要』还是『根本没敲掉』。"},{"do":"达标后再加处理物测表型（如死亡指标、脂滴量），并与工具药结果对照着读。","why":"遗传学（敲低/过表达）和药理学（抑制剂/激活剂）两个方向证据一致，因果链才算双保险。"}],"controls":["敲低效率只有两三成：换靶点序列、多条 siRNA 合并或改转染条件，别拿不达标的数据硬解释。","转染后大批死亡：降核酸/转染试剂用量、缩短换液间隔、检查细胞本身状态与支原体。","过表达量高得离谱：超生理表达会造出假相互作用和假表型，尽量选温和表达条件，并用敲低结果反向互证。","脱靶效应：关键结论最好用两条不同序列的 siRNA 重复，或做回补（rescue）实验。"],"readout":"汇报顺序：先效率图（mRNA 与蛋白各一），后表型图。判读口径：敲低加重+过表达挽救（或反之）方向互证最强；只有一个方向的结果，结论强度减半。"},"ELISA（酶联免疫吸附）":{"materials":["试剂：目标因子 ELISA 试剂盒（预包被板、标准品、检测抗体、酶结合物、底物、终止液、洗液）","器材：酶标仪（450 nm）、多通道移液器、洗板机或洗瓶、37°C 孵箱"],"steps":[{"do":"收样本：培养上清离心去碎片（或血清按生化流程分离），分装后 −80°C 保存，测时只冻融一次。","why":"细胞碎片会非特异显色；细胞因子反复冻融会降解，浓度一路走低。"},{"do":"做标准曲线：标准品按说明书倍比稀释成 6–8 个梯度，与样本同板同测。","why":"样本浓度是拿标准曲线换算出来的，曲线不合格（R² 低、梯度不顺）整板数据作废。"},{"do":"加样孵育：标准品、样本（每份 2 复孔）加入预包被板，37°C 孵育（常见 60–90 min，以试剂盒为准）。","why":"目标蛋白先被板上抗体抓住；孵育不足结合不完全，浓度被低估。"},{"do":"洗板：甩干孔内液体，洗液注满静置片刻后甩干，重复 3–5 次，最后在吸水纸上拍干。","why":"洗不净是 ELISA 背景高的头号原因；但拍过头把结合的蛋白拍掉也会出事，力度要稳。"},{"do":"酶标抗体+显色：按顺序加检测抗体、酶结合物（各孵育并洗板），最后加底物避光显色（常见 10–20 min，见梯度蓝色分明），加终止液变黄。","why":"底物显色是酶量信号的放大环节，显色时间各板必须一致，超时整板饱和。"},{"do":"读数计算：终止后尽快在 450 nm 读数（可设参比波长），用四参数拟合标准曲线算样本浓度；超曲线范围的样本稀释后重测。","why":"超出标准曲线两端的读数是外推出来的，不可信——稀释重测是唯一正解。"}],"controls":["整板背景都高：洗板不足、样本太脏或显色超时，先从洗板和显色时间排查。","复孔 CV 大（>15%）：移液不稳或孔边蒸发，样本区避开最外圈或外圈加 PBS 保湿。","样本读数全在曲线低端：上清收集时间太早/刺激太弱，或样本被稀释过头，必要时浓缩或延收集时间（按实验设计）。","拿 ELISA 测胞内前体：它测的是已分泌到上清的量，胞内 pro-IL-1β 的变化要靠 WB，别混。"],"readout":"报实际浓度（pg/mL）并注明标准曲线范围；判读时和胞内条带分工：WB 说通路在胞内被激活，ELISA 说炎症因子真的放出去了，两边同向才算焦亡的炎症属性成立。"},"组织病理与血清生化（HE 染色 / ALT·AST）":{"materials":["试剂：4% PFA 或 10% 中性缓冲福尔马林、梯度乙醇、二甲苯、石蜡、苏木素、盐酸酒精、伊红、中性树胶；ALT/AST 检测试剂盒（或全自动生化仪试剂）","器材：包埋机、切片机、摊烤片机、显微镜、离心机、酶标仪/生化仪"],"steps":[{"do":"取材固定：处死后立即取肝/肾，PBS 冲去血污，切适宜大小投入固定液，固定 24–48 h（固定液体积至少为组织 10 倍）。","why":"固定不及时组织会自溶，病理形态全变样；太小块的组织在后续流程里容易丢。"},{"do":"血清分离：取血后室温静置凝固约 30 min–1 h，约 1,000×g 离心 10 min，吸上层血清，分装 −80°C。","why":"溶血会让 ALT/AST 假性升高——取血和离心动作粗暴，这批生化数据就废了。"},{"do":"脱水包埋切片：组织梯度乙醇脱水→二甲苯透明→浸蜡包埋，切 4–5 μm 薄片，摊片后烤干备用。","why":"厚度不均会让染色深一块浅一块，判读时分不清是病变还是手艺问题。"},{"do":"HE 染色：脱蜡水化→苏木素染核约 3–5 min→盐酸酒精分化数秒→流水返蓝→伊红染胞质约 1–2 min→脱水透明→中性树胶封片。具体时间以实验室现行 SOP 为准。","why":"苏木素把核染蓝紫、伊红把胞质染粉红，组织结构（坏死、炎症浸润、空泡变性）全靠这组对比显形；分化过度核会发白、不足则满片发蓝。"},{"do":"镜检判读：低倍看整体结构、高倍看细胞细节；多视野观察，最好由不知分组的人盲法做半定量评分（如炎症/坏死分级）。","why":"病理图最容易被『挑视野』毁掉可信度——盲法+多视野+评分是标准防线。"},{"do":"ALT/AST 检测：血清按试剂盒（赖氏法/速率法）或生化仪流程测，带质控，结果看相对对照的倍数。","why":"转氨酶是肝细胞膜漏的间接读数：细胞坏得越多漏得越多，是体内损伤的定量锚点。"}],"controls":["肝组织满是空泡就写『脂滴堆积』：石蜡流程已把脂溶掉，空泡只是脂滴留下的坑；要证脂滴本体，另做冰冻切片油红 O。","ALT/AST 升高就指认某种死亡：转氨酶对死法毫无特异性，只能说肝损伤程度，死法归组织和细胞层面证据管。","染色深浅批间差大：固定时间、切片厚度、染色时间三者固定成 SOP 再批量做。","样本溶血：采血手法和离心条件出的问题，溶血样本的生化值直接弃用。"],"readout":"体内结论的汇报口径：病理（形态）+转氨酶（定量）+组织 WB（机制）三件套同向，动物层面的结论才站得住；三者打架时，先查取材一致性和造模成功率。"},"细胞培养、传代与冻存":{"materials":["试剂：基础培养基（按细胞选，如 DMEM/DMEM-F12）、胎牛血清 FBS、双抗（青霉素-链霉素）、无菌 PBS、0.25% 胰酶（含 EDTA）、细胞冻存液（或培养基+血清+10% DMSO 自配，按实验室现行配方）","器材：生物安全柜、37°C 5% CO₂ 培养箱、水浴锅、低温离心机、细胞计数板或自动计数仪、程序降温盒、液氮罐；支原体检测试剂（定期）"],"steps":[{"do":"准备：安全柜紫外照 30 min，培养基、PBS、胰酶提前回温到室温或 37°C；台面和双手 75% 酒精消毒。","why":"无菌是细胞房的命根子，污染一次丢的不只是这瓶细胞，还有排在后面的一周实验。"},{"do":"复苏：冻存管从液氮取出立即放 37°C 水浴轻晃，约 1 min 融化到只剩小冰晶；转入含培养基的离心管，约 100–200×g 离心 3–5 min，弃含 DMSO 的上清，完全培养基重悬后接种。","why":"复苏讲究快：DMSO 在常温下对细胞有毒，慢融+不及时去掉，活率直接打折。"},{"do":"日常培养：37°C、5% CO₂ 培养，每天在镜下看三件事——密度、形态、培养基颜色；一般 2–3 天换一次液。","why":"培养基变黄=酸化（细胞太密或污染），变浑=细菌污染，形态拉长/圆缩=状态下滑——每天看一眼能拦住大多数事故。"},{"do":"传代时机：贴壁细胞长到 80–90% 融合时传代，别等长满叠层。","why":"过密会接触抑制、状态漂移，甚至诱发非预期的死亡和分化，后面数据批间不可比。"},{"do":"消化传代：弃培养基，PBS 洗 1 次；加 0.25% 胰酶覆盖瓶底，37°C 消化 1–3 min，镜下见细胞变圆、轻拍脱落立即加等体积以上完全培养基终止；轻柔吹打成单细胞悬液，按 1:2–1:4 比例分到新瓶补足培养基。","why":"胰酶靠血清里的抑制成分终止；消化过度伤膜（后续 Annexin V 会假阳性），不足则成团、计数和铺板都不准。"},{"do":"计数铺板（做实验时）：消化后取样计数（台盼蓝排斥法区分活死），按实验设计密度接种，十字晃匀，放回培养箱。","why":"各组密度一致是所有定量实验的前提；晃匀防细胞全堆在中间，接种不均是复孔差异大的常见来源。"},{"do":"冻存保种：选对数期、状态好的细胞，消化计数后用冻存液重悬（常用密度约 1×10⁶ 个/mL 量级），分装冻存管，入程序降温盒 −80°C 过夜，次日转液氮长期保存，并登记代次与日期。","why":"程序降温（约 −1°C/min）让细胞安全结冰；直冻形成冰晶扎破膜，复苏就是一管死细胞。代次登记防无限传代导致表型漂移。"},{"do":"定期体检：每 1–2 个月或新复苏批次做一次支原体检测；状态异常、增殖突然变快/变慢都要排查。","why":"支原体看不见、不浑浊，却能悄悄改掉细胞的代谢和死亡敏感性——多少『重复不出来』的实验最后查出是它。"}],"controls":["培养基迅速变黄变浑：细菌污染，整瓶弃掉并消毒培养箱，别试图用加抗生素『救』回来做实验。","消化完细胞成团吹不散：消化不足或吹打太暴力产生大量 DNA 絮状物（死细胞多时），先优化消化时间、减少死亡来源。","同一实验批间结果跳：查代次、查铺板密度、查血清批次——三者是批间差异的三大户，实验记录里要固定登记。","HepG2 特别爱成团、贴壁牢：消化可稍延长并充分吹打；AML-12 等对培养基配方有专门要求（如加 ITS、地塞米松与否），以细胞说明书和实验室现行培养体系为准。"],"readout":"开实验前的放行标准：形态正常贴壁好、密度符合设计、无污染迹象、支原体阴性（在检测有效期内）、代次在实验室规定范围内。任何一条不过，宁可重铺一板，也别带着问题细胞做机制实验。"},"免疫共沉淀 Co-IP":{"materials":["试剂：IP 专用温和裂解液（如含 NP-40 的低盐裂解液）、蛋白酶/磷酸酶抑制剂、IP 级目标抗体、与一抗同源的正常 IgG（阴性对照）、蛋白 A/G 磁珠或琼脂糖珠、PBS/洗涤缓冲液、上样缓冲液","器材：4°C 旋转摇床（转轮）、磁力架（磁珠法）或低温离心机、金属浴；后续 WB 全套"],"steps":[{"do":"裂解：细胞用预冷 PBS 洗，用 IP 裂解液（现加抑制剂）冰上裂解 30 min，4°C、12,000×g 离心 15 min 取上清；先留一小份作 Input，冻存待用。","why":"Co-IP 的裂解液必须温和——RIPA 太狠会把蛋白间的相互作用拆散；Input 是后面证明『样本里本来有这两个蛋白』的底账，没留就没法判读阴性结果。"},{"do":"定量取等量：BCA 定量后各组取等量总蛋白（常用 500 μg–1 mg）补齐到相同体积。","why":"拉下来的量要可比，前提是投进去的量一致。"},{"do":"（推荐）预清除：每管加少量空白珠子，4°C 转轮孵育 30–60 min，磁吸/离心去掉珠子，保留上清。","why":"先把裂解液里爱乱粘珠子的蛋白清走，正式 IP 的背景会干净很多。"},{"do":"抗体结合：加入 IP 抗体（常用 1–5 μg，以抗体说明书和预实验为准），4°C 转轮孵育过夜。","why":"低温长时间让抗体充分抓住目标蛋白及其复合物；这一步偷时间，弱相互作用先掉队。"},{"do":"珠子捕获：加洗净的蛋白 A/G 珠子，4°C 转轮再孵育 2–4 h。","why":"珠子上的蛋白 A/G 抓住抗体的 Fc 段，把『抗体—目标—伙伴』整串提出来。"},{"do":"洗涤：磁吸或离心去上清，用裂解液/洗涤液洗 3–5 次，每次短暂混匀后分离珠子，最后吸净残液。","why":"洗掉的是非特异粘附；洗太少背景脏，洗太狠（盐太高、次数太多）会把弱相互作用洗掉——这是 Co-IP 最要摸索的平衡点。"},{"do":"洗脱煮样：珠子加 1× 上样缓冲液，95°C 煮 5 min，磁吸/离心取上清，与 Input 一起跑 WB，用『伙伴蛋白』的抗体检测。","why":"把复合物从珠子上煮下来变性拆散，WB 才能逐个蛋白验身份。"},{"do":"对照同行：全程平行做 IgG 对照组（同量正常 IgG 代替 IP 抗体）；关键结论再交换抗体做反向 IP（用伙伴的抗体拉、用目标的抗体测）。","why":"IgG 组干净、Input 组有带、IP 组有带、反向 IP 也成立——四格齐了，『相互作用』才立得住。"}],"controls":["IgG 对照也拉出带：非特异结合太重——加预清除、增洗涤次数、降样本量或换珠子类型。","Input 有带、IP 怎么都没带：相互作用弱/瞬时、裂解太狠或抗体不适合 IP（很多抗体只认变性蛋白）——换温和裂解液、换标注 IP 级的抗体、缩短洗涤。","检测带附近有 55/25 kDa 强带干扰：那是 IP 抗体的重链/轻链被二抗认出来了——把抗体交联在珠子上，或用构象特异/轻链特异的二抗避开。","目标蛋白分子量与重链接近：优先考虑交联法或换检测方向（反向 IP）。"],"readout":"判读四格：Input 有带（样本没问题）、IgG 无带（非特异干净）、IP 有带（复合物成立）、反向 IP 复现（双保险）。措辞上写『处于同一复合物/存在相互作用证据』，不要直接写成『两蛋白直接结合』——那是体外纯化蛋白实验才能下的话。"}},"SOP_DISCLAIMER":"以下流程是通用标准流程，参数是常用范围，不是课题组内部配方。具体浓度、时长、抗体稀释比，一律以实验室现行 SOP 和试剂盒说明书为准；两边不一致时，以实验室现行 SOP 为准。"};

    function doExportProgress() {

        a.download = "论文研读器-学习进度.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { try { URL.revokeObjectURL(url); } catch (err) {} }, 1000);
        dataMsg = { ok: true, text: "进度文件已导出。请妥善保存该文件，换用其他设备时可通过「导入进度」恢复。" };

        dataMsg = { ok: false, text: "导出未成功。当前浏览器未能生成下载文件，请更换浏览器后重试。" };

    function doImportFile(file) {
      if (!file) return;

        try {
          var parsed = JSON.parse(String(reader.result || ""));
          if (!parsed || typeof parsed !== "object" || (!("progress" in parsed) && !("extras" in parsed))) throw new Error("invalid");
          var clean = sanitizeProgress(parsed);
          progress = clean.progress;

    function setupTocSpy() {

      tocObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting && detail) {
            var key = e.target.id.replace("sec-", "");
            if (detail.activeToc !== key) {
              detail.activeToc = key;
              overlayRoot.querySelectorAll(".toc-chip").forEach(function (chip) {

        });
      }, { root: ov, rootMargin: "-72px 0px -55% 0px" });
      overlayRoot.querySelectorAll(".dsec-wrap").forEach(function (el) { tocObserver.observe(el); });
    }

    function gradeCurrent(grade) {
      var p = paperById(session.queue[session.index]);

      var pr = ensureProg(p);
      var sched = nextSchedule(pr.box, grade);
      pr.box = sched.box; pr.next_review = sched.next_review; pr.last_grade = grade;
      if (pr.status === "unread") pr.status = "reading";
      persistSave();
      session.tally[grade]++;
      if (grade === "again" && session.stuck.indexOf(p.id) < 0) session.stuck.push(p.id);
      session.flipped = false;
      session.index++;
      renderSession();
      var ov = sessionRoot.querySelector(".session-overlay");
      if (ov) ov.scrollTop = 0;

            '<div style="display:flex;gap:8px;font-size:14px;margin-bottom:8px"><dt style="width:48px;flex-shrink:0;font-weight:600;color:var(--dim)">处理</dt><dd style="margin:0">' + esc(p.treatment) + "</dd></div>" +
            '<div style="display:flex;gap:8px;font-size:14px"><dt style="width:48px;flex-shrink:0;font-weight:600;color:var(--dim)">模型</dt><dd style="margin:0">' + esc(p.model) + "</dd></div></dl>" +
            '<div class="quiz-callout"><p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--accent)">检测题 · 请先独立作答，再翻卡对照</p>' +
            '<p style="margin:6px 0 0;font-size:15px;font-weight:500;line-height:1.7">' + esc(quizQ) + "</p></div>" +
            '<p style="margin:16px 0 0;font-size:14px;line-height:1.75;color:var(--dim)">作答要求：完整复述机制链的起点、中间节点、各步之间的作用关系及最终结局。复述中断处，即为尚未理解之处。</p>' +
            '<button type="button" class="btn-accent" id="flip-btn" style="margin-top:20px;width:100%;padding:14px;font-size:16px" aria-label="翻开卡片对照机制链与讲解">完成作答 · 翻卡对照</button></div>';
        } else {
          html += '<div style="padding-top:16px"><p style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--dim)">机制链</p>' +
            '<div style="background:var(--bg);padding:12px;border-radius:8px">' + chainHTML(p.mechanism) + "</div>" +
            '<p style="margin:12px 0 0;font-size:13px;line-height:1.7;color:var(--dim)">' + esc(p.mechanism) + "</p>";
          if (deep) {
            html += '<div class="animate-expand" style="margin-top:12px;border-left:2px solid var(--coral);padding-left:12px"><p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--coral)">参考解析</p>' +
              '<p style="margin:4px 0 0;font-size:14px;line-height:1.75">' + esc(deep.quiz.a) + "</p></div>";
          }
          html += '<p style="margin:20px 0 0;font-size:13px;font-weight:500;color:var(--dim)">请根据作答情况如实评定：</p>' +
            '<div class="grade-grid">' +
            '<button type="button" class="grade-btn grade-again" data-grade="again" aria-label="评定：尚未掌握，返回解析重新学习，次日再次检测">尚未掌握<small>次日再次检测</small></button>' +
            '<button type="button" class="grade-btn grade-hard" data-grade="hard" aria-label="评定：基本掌握，数日后复习检测">基本掌握<small>数日后复习检测</small></button>' +
            '<button type="button" class="grade-btn grade-good" data-grade="good" aria-label="评定：已掌握，延长复习间隔">已掌握<small>延长复习间隔</small></button>' +
            "</div></div>";
        }
        html += "</div></div>";
      }
      html += "</div></div>";
      sessionRoot.innerHTML = html;
    }

    /* ======= 全局事件委托 ======= */
    document.addEventListener("click", function (e) {
      var t = e.target;
      function closest(sel) { return t.closest ? t.closest(sel) : null; }

      var tabBtn = closest("[data-tab]");
      if (tabBtn) { tab = tabBtn.getAttribute("data-tab"); render(); return; }

      var navBtn = closest("[data-nav]");
      if (navBtn) { tab = navBtn.getAttribute("data-nav"); render(); return; }

      if (closest("[data-open-guide]")) { guideOpen = true; renderGuide(); return; }
      if (closest("#guide-close")) { guideOpen = false; renderGuide(); return; }
      if (closest("#guide-step1-done")) { guideStep1Done = true; savedGuideStep1Done = true; persistSave(); renderGuide(); return; }
      if (closest("[data-guide-open-first]")) { var fp = firstPaper(); guideOpen = false; renderGuide(); if (fp) openPaper(fp.id); return; }
      if (closest("#guide-start-quiz")) { var fp2 = firstPaper(); guideOpen = false; renderGuide(); if (fp2) startSession([fp2]); return; }

      var sd = closest("[data-search-drug]");
      if (sd) { openDrug = sd.getAttribute("data-search-drug"); tab = "drugs"; render(); return; }
      var sm = closest("[data-search-method]");
      if (sm) { openMethod = sm.getAttribute("data-search-method"); tab = "methods"; render(); return; }
      var st2 = closest("[data-search-term]");
      if (st2) { openHub = "term:" + st2.getAttribute("data-search-term"); tab = "terms"; render(); return; }
      var sh = closest("[data-search-hub]");
      if (sh) { openHub = sh.getAttribute("data-search-hub"); tab = "hubs"; render(); return; }

      var lf = closest("[data-lib-filter]");
      if (lf) {
        var v = lf.getAttribute("data-lib-filter");
        libFilter = /^[1-4]$/.test(v) ? parseInt(v, 10) : v;
        rerenderKeepScroll();
        return;
      }
      if (closest("[data-clear-lib]")) { libFilter = "all"; rerenderKeepScroll(); return; }
      var df = closest("[data-drug-filter]");
      if (df) { drugFilter = df.getAttribute("data-drug-filter"); rerenderKeepScroll(); return; }
      if (closest("[data-clear-drugs]")) { drugFilter = "all"; toolQuery = ""; rerenderKeepScroll(); return; }
      if (closest("[data-clear-methods]")) { toolQuery = ""; rerenderKeepScroll(); return; }

      var hubBtn = closest("[data-hub]");
      if (hubBtn) { var hv = hubBtn.getAttribute("data-hub"); openHub = openHub === hv ? null : hv; rerenderKeepScroll(); return; }
      var drugBtn = closest("[data-drug]");
      if (drugBtn) { var dv = drugBtn.getAttribute("data-drug"); openDrug = openDrug === dv ? null : dv; rerenderKeepScroll(); return; }
      var methBtn = closest("[data-method]");
      if (methBtn) { var mv = methBtn.getAttribute("data-method"); openMethod = openMethod === mv ? null : mv; rerenderKeepScroll(); return; }

      if (closest("#btn-start-session")) { startSession(todayQueue()); return; }

      var stuckBtn = closest("[data-stuck-open]");
      if (stuckBtn) { endSession(parseInt(stuckBtn.getAttribute("data-stuck-open"), 10)); return; }
      if (closest("#session-exit") || closest("#session-done")) { endSession(null); return; }
      if (closest("#flip-btn")) { if (session) { session.flipped = true; renderSession(); } return; }
      var gradeBtn = closest("[data-grade]");
      if (gradeBtn && session) { gradeCurrent(gradeBtn.getAttribute("data-grade")); return; }

      if (closest("#btn-export")) { doExportProgress(); return; }
      if (closest("#btn-import")) { var imp = document.getElementById("import-file"); if (imp) { imp.value = ""; imp.click(); } return; }
      if (closest("#btn-clear")) { clearConfirm = true; dataMsg = null; rerenderKeepScroll(); return; }
      if (closest("#btn-clear-cancel")) { clearConfirm = false; rerenderKeepScroll(); return; }
      if (closest("#btn-clear-confirm")) { doClearProgress(); return; }

      var openBtn = closest("[data-open-paper]");
      if (openBtn) { openPaper(parseInt(openBtn.getAttribute("data-open-paper"), 10)); return; }

      if (!detail) return;
      if (closest("#detail-back")) { closePaper(); return; }
      if (closest("#detail-go-route")) { closePaper(); tab = "route"; render(); return; }
      if (closest("#detail-study")) { var p0 = paperById(detail.id); if (p0) startSession([p0]); return; }
      var tocBtn = closest("[data-toc]");
      if (tocBtn) {
        var tk = tocBtn.getAttribute("data-toc");
        detail.openSecs[tk] = true;
        persistSave();
        detail.activeToc = tk;
        renderDetail();
        var sec = document.getElementById("sec-" + tk);
        if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      var stepBtn = closest("[data-chain-step]");
      if (stepBtn) { detail.chainSel = parseInt(stepBtn.getAttribute("data-chain-step"), 10); renderDetailKeep(); return; }
      if (closest("#chain-prev")) { detail.chainSel = Math.max(0, detail.chainSel - 1); renderDetailKeep(); return; }
      if (closest("#chain-next")) { detail.chainSel = detail.chainSel + 1; renderDetailKeep(); return; }
      var foldBtn = closest("[data-fold]");
      if (foldBtn) { var fk = foldBtn.getAttribute("data-fold"); detail.openSecs[fk] = !detail.openSecs[fk]; persistSave(); renderDetailKeep(); return; }
      var termBtn = closest("[data-term]");
      if (termBtn) { var tv = termBtn.getAttribute("data-term"); detail.openTerm = detail.openTerm === tv ? null : tv; renderDetailKeep(); return; }
      if (closest("#quiz-reveal")) { detail.quizRevealed = true; var pq = paperById(detail.id); if (pq) ensureExtras(pq).quizRevealed = true; persistSave(); renderDetailKeep(); return; }
      if (closest("#verdict-yes")) { detail.verdict = "yes"; var py = paperById(detail.id); if (py) ensureExtras(py).verdict = "yes"; persistSave(); renderDetailKeep(); return; }
      if (closest("#verdict-no")) { detail.verdict = "no"; var pn = paperById(detail.id); if (pn) ensureExtras(pn).verdict = "no"; persistSave(); renderDetailKeep(); return; }
      var stBtn = closest("[data-status]");
      if (stBtn) {
        var pp = paperById(detail.id);
        if (pp) { ensureProg(pp).status = stBtn.getAttribute("data-status"); persistSave(); }
        renderDetailKeep(); return;
      }
      if (closest("#note-save")) {
        var ni = document.getElementById("note-input");
        var pv = paperById(detail.id);
        if (pv && ni) { ensureProg(pv).note = ni.value; detail.noteDraft = ni.value; detail.noteSaved = true; persistSave(); }
        renderDetailKeep(); return;
      }
    });

    document.addEventListener("input", function (e) {
      if (e.target.id === "global-search") {
        searchQuery = e.target.value;
        refreshSearchView("global-search");
      } else if (e.target.id === "tool-search") {
        toolQuery = e.target.value;
        refreshSearchView("tool-search");
      } else if (e.target.id === "note-input" && detail) {
        detail.noteDraft = e.target.value; detail.noteSaved = false;
      } else if (e.target.id === "quiz-draft" && detail) {
        detail.quizDraft = e.target.value;
        var qpp = paperById(detail.id);
        if (qpp) { ensureExtras(qpp).quizDraft = e.target.value; persistSave(); }
      }
    });

    document.addEventListener("change", function (e) {
      if (e.target.id === "import-file") {
        var f = e.target.files && e.target.files[0];
        if (f) doImportFile(f);
      }
    });

    function refreshSearchView(inputId) {
      var y = window.scrollY;
      var el = document.getElementById(inputId);
      var pos = el ? el.selectionStart : null;
      renderTabbar();
      var html;
      if (tab === "tools") html = toolsHTML();
      else if (tab === "drugs") html = drugsHTML();
      else if (tab === "methods") html = methodsHTML();
      else html = "";
      if (html) view.innerHTML = html + footerHTML();
      window.scrollTo(0, y);
      var s = document.getElementById(inputId);
      if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (err) {} }
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (session) { endSession(null); }
        else if (guideOpen) { guideOpen = false; renderGuide(); }
        else if (detail) { closePaper(); }
      }
    });

    render();
    </script>
  </body>
</html>
