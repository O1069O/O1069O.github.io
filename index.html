<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>论文研读器（网页版）</title>
    <meta name="description" content="论文研读器（网页版）：课题组 2023–2026 年 26 篇论文精读，含学习路线、证据链、药品与实验方法库，学习记录保存于本机浏览器。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="论文研读器（网页版）" />
    <meta property="og:description" content="课题组 2023–2026 年 26 篇论文精读：学习路线、证据链、药品与实验方法库。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f2ec;
        --surface: #fffef9;
        --surface-2: #eceade;
        --text: #1b2321;
        --dim: #5f6d66;
        --border: #ddd8c8;
        --accent: #0c4a45;
        --accent-strong: #08332f;
        --accent-soft: #d9eae2;
        --coral: #c9502b;
        --coral-soft: #f9e7de;
        --amber: #9a6f0e;
        --amber-soft: #f4ead0;
        --hero-bg: #0d3b35;
        --hero-bg-2: #092b26;
        --hero-text: #f2f0e6;
        --hero-dim: #a9c4bb;
        --radius: 14px;
        --shadow-card: 0 1px 2px rgba(27,35,33,.05), 0 6px 18px -8px rgba(27,35,33,.14);
        --shadow-lift: 0 2px 4px rgba(27,35,33,.06), 0 14px 30px -12px rgba(27,35,33,.22);
        --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1311;
          --surface: #182019;
          --surface-2: #212b24;
          --text: #edeade;
          --dim: #9daba2;
          --border: #2f3a33;
          --accent: #63cdbc;
          --accent-strong: #8fdccd;
          --accent-soft: #1d3831;
          --coral: #f0875f;
          --coral-soft: #3d271c;
          --amber: #dbb04a;
          --amber-soft: #39300f;
          --hero-bg: #14453d;
          --hero-bg-2: #0c2b27;
          --hero-text: #f2f0e6;
          --hero-dim: #9dc0b4;
          --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px -10px rgba(0,0,0,.55);
          --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 16px 34px -12px rgba(0,0,0,.6);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; -webkit-tap-highlight-color: transparent; }
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }
      a { color: var(--accent); }
      .font-display { font-family: var(--serif); }
      .font-node { font-family: var(--mono); }
      .wrap { margin: 0 auto; width: 100%; max-width: 672px; padding: 0 16px 110px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); }
      .card-lift { box-shadow: var(--shadow-lift); }
      @keyframes rise-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-rise { animation: rise-in .35s ease-out both; }
      @keyframes flip-in { from { opacity: .4; transform: perspective(900px) rotateX(7deg) translateY(4px); } to { opacity: 1; transform: perspective(900px) rotateX(0) translateY(0); } }
      .animate-flip { animation: flip-in .32s ease-out both; }
      @keyframes expand-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
      .animate-expand { animation: expand-in .25s ease-out both; }
      @media (prefers-reduced-motion: reduce) {
        .animate-rise, .animate-flip, .animate-expand { animation: none; }
      }

      /* ---------- hero dashboard ---------- */
      .hero {
        margin-top: 20px; padding: 20px; border-radius: 20px; color: var(--hero-text);
        background: linear-gradient(155deg, var(--hero-bg) 0%, var(--hero-bg-2) 100%);
      }
      .hero .kicker { font-size: 13px; color: var(--hero-dim); margin: 0; }
      .hero h1 { font-family: var(--serif); font-weight: 900; font-size: 26px; line-height: 1.35; margin: 8px 0 0; }
      .hero .sub { margin: 8px 0 0; font-size: 14px; line-height: 1.7; color: var(--hero-dim); }
      .hero-flex { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .hero-actions { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
      .btn-coral { background: var(--coral); color: #fff; font-weight: 600; font-size: 16px; padding: 14px 24px; border-radius: var(--radius); }
      .btn-coral:disabled { opacity: .4; cursor: default; }
      .btn-ghost-hero { border: 1px solid rgba(242,240,230,.45); color: var(--hero-text); font-weight: 600; font-size: 16px; padding: 14px 20px; border-radius: var(--radius); }
      .btn-accent { background: var(--accent); color: #fff; font-weight: 600; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; }
      @media (prefers-color-scheme: dark) { .btn-accent { color: #0e1311; } }
      .ring-wrap { position: relative; flex-shrink: 0; }
      .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

      .stat-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
      .stat-grid .card { padding: 14px 4px; }
      .stat-num { font-family: var(--mono); font-size: 24px; font-weight: 700; line-height: 1.2; margin: 0; }
      .stat-num small { font-size: 14px; font-weight: 400; color: var(--dim); }
      .stat-label { margin: 2px 0 0; font-size: 12px; color: var(--dim); }

      .section-title { font-family: var(--serif); font-size: 18px; font-weight: 700; margin: 36px 0 0; }
      .section-title-lg { font-family: var(--serif); font-size: 24px; font-weight: 900; margin: 0; }
      .page-head { padding-top: 20px; }
      .page-desc { margin: 8px 0 0; font-size: 14px; line-height: 1.7; color: var(--dim); }

      /* ---------- paper rows ---------- */
      .paper-row {
        position: relative; display: block; width: 100%; text-align: left;
        background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        box-shadow: var(--shadow-card); padding: 12px 12px 12px 16px; margin-bottom: 8px;
      }
      .paper-row .row-top { display: flex; align-items: baseline; gap: 8px; }
      .paper-row .yr { font-family: var(--mono); font-size: 12px; color: var(--dim); flex-shrink: 0; }
      .paper-row .ttl { flex: 1; font-size: 15px; font-weight: 600; line-height: 1.45; }
      .paper-row .meta { margin-top: 4px; padding-left: 36px; font-size: 13px; line-height: 1.6; color: var(--dim); }
      .badge { flex-shrink: 0; padding: 2px 6px; font-size: 11px; border-radius: 4px; }
      .badge-due { font-weight: 700; color: var(--coral); background: var(--coral-soft); }
      .badge-done { font-weight: 700; color: var(--accent); background: var(--accent-soft); }
      .badge-plain { color: var(--dim); }
      .circ { display: inline-block; margin-left: 6px; padding: 0 4px; font-size: 11px; font-weight: 700; color: var(--amber); background: var(--amber-soft); border-radius: 4px; }

      /* ---------- chips / filters ---------- */
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        padding: 6px 12px; font-size: 13px; font-weight: 500; border-radius: 999px;
        border: 1px solid var(--border); background: var(--surface); color: var(--dim);
      }
      .chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
      @media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { color: #0e1311; } }
      .term-chip {
        padding: 6px 10px; font-size: 13px; font-weight: 500; border-radius: 999px;
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
      }
      .term-chip[aria-expanded="true"] { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { .term-chip[aria-expanded="true"] { color: #0e1311; } }

      /* ---------- chain ---------- */
      .chain { display: flex; flex-wrap: wrap; align-items: stretch; row-gap: 6px; }
      .chain-step-wrap { display: flex; align-items: center; }
      .chain-node {
        display: inline-block; padding: 6px 10px; font-size: 13px; line-height: 1.5;
        border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-weight: 500;
      }
      .chain-node.last { border: 1.5px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
      @media (prefers-color-scheme: dark) { .chain-node.last { color: #0e1311; } }
      .chain-arrow { margin: 0 4px; font-weight: 700; color: var(--accent); }
      button.chain-node { text-align: left; font-weight: 400; }
      button.chain-node.sel { border: 1.5px solid var(--accent); background: var(--accent-soft); font-weight: 700; }
      button.chain-node .idx { font-family: var(--mono); margin-right: 4px; font-size: 11px; color: var(--accent); }
      .chain-explain { margin-top: 12px; border-left: 2px solid var(--accent); background: var(--bg); padding: 8px 8px 8px 12px; }
      .chain-nav { margin-top: 8px; display: flex; gap: 8px; }
      .chain-nav button { padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; }
      .chain-nav button:disabled { opacity: .4; cursor: default; }

      /* ---------- detail ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: var(--bg);
        -webkit-overflow-scrolling: touch;
      }
      .overlay .wrap { padding-bottom: 48px; }
      .detail-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
      .back-btn { font-size: 14px; font-weight: 500; color: var(--dim); padding: 4px 0; }
      .d-sec { margin-top: 28px; font-size: 14px; font-weight: 700; letter-spacing: .02em; color: var(--dim); }
      .d-body { margin-top: 8px; font-size: 14px; line-height: 1.75; }
      .kv { display: flex; gap: 12px; font-size: 14px; margin-top: 10px; }
      .kv dt { width: 56px; flex-shrink: 0; font-weight: 600; color: var(--dim); }
      .kv dd { margin: 0; }
      .readout-card { border: 1px solid var(--border); background: var(--surface); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
      .readout-card .m { font-family: var(--mono); font-size: 13px; font-weight: 700; }
      .readout-card .p { margin-top: 4px; font-size: 13px; line-height: 1.7; color: var(--dim); }
      .verify-claim { margin: 0 0 12px; border-left: 2px solid var(--accent); background: var(--accent-soft); padding: 8px 8px 8px 12px; font-size: 14px; line-height: 1.75; }
      .verify-card { border: 1px solid var(--border); background: var(--surface); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
      .verify-card .c { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); }
      .verify-row { display: flex; gap: 8px; margin-top: 6px; font-size: 13px; line-height: 1.7; }
      .verify-row .k { flex-shrink: 0; width: 30px; font-weight: 700; color: var(--dim); }
      .verify-row .v { margin: 0; }
      .pitfall { border-left: 2px solid var(--coral); background: var(--coral-soft); padding: 8px 8px 8px 12px; font-size: 13px; line-height: 1.7; margin-bottom: 8px; }
      .note-amber { border-left: 2px solid var(--amber); background: var(--amber-soft); padding: 8px 8px 8px 12px; font-size: 13px; line-height: 1.7; }
      .quiz-box { border: 1px solid var(--border); background: var(--surface); padding: 16px; border-radius: var(--radius); }
      .quiz-box textarea, .note-area {
        width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text);
        padding: 12px; font-size: 14px; line-height: 1.7; border-radius: 8px; font-family: inherit; resize: vertical;
      }
      .quiz-box textarea::placeholder, .note-area::placeholder { color: var(--dim); }
      .answer-block { margin-top: 12px; border-left: 2px solid var(--coral); padding-left: 12px; font-size: 14px; line-height: 1.75; }
      .verdict-btn { padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: 999px; }
      .status-seg { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border: 1px solid var(--border); background: var(--surface); padding: 4px; border-radius: var(--radius); }
      .status-seg button { padding: 8px 0; font-size: 14px; font-weight: 600; border-radius: 7px; color: var(--dim); }
      .status-seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { .status-seg button[aria-pressed="true"] { color: #0e1311; } }
      .term-def { margin-top: 10px; border: 1px solid var(--border); background: var(--surface); padding: 12px; border-radius: 8px; }

      /* ---------- session ---------- */
      .session-overlay { position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }
      .progress-track { height: 6px; width: 100%; overflow: hidden; background: var(--surface-2); border-radius: 999px; }
      .progress-fill { height: 100%; background: var(--accent); transition: width .3s ease; }
      .flash-card { border: 1px solid var(--border); background: var(--surface); padding: 20px; border-radius: 18px; box-shadow: var(--shadow-lift); }
      .quiz-callout { margin-top: 20px; padding: 16px; background: var(--accent-soft); border-radius: 12px; }
      .grade-grid { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .grade-btn { padding: 12px 4px; font-size: 13px; font-weight: 700; border-radius: var(--radius); }
      .grade-btn small { display: block; font-size: 11px; font-weight: 400; margin-top: 2px; }
      .grade-again { color: var(--coral); background: var(--coral-soft); }
      .grade-hard { color: var(--amber); background: var(--amber-soft); }
      .grade-good { color: var(--accent); background: var(--accent-soft); }

      /* ---------- accordion cards (hubs/drugs/methods/glossary) ---------- */
      .acc { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-card); margin-bottom: 10px; overflow: hidden; }
      .acc-head { display: block; width: 100%; text-align: left; padding: 16px; }
      .acc-body { border-top: 1px solid var(--border); padding: 12px 16px 16px; }
      .cat-tag { display: inline-block; margin-right: 8px; padding: 2px 6px; font-size: 11px; font-weight: 700; color: #fff; border-radius: 5px; vertical-align: middle; }
      .sop-num {
        margin-top: 2px; display: flex; align-items: center; justify-content: center;
        height: 24px; width: 24px; flex-shrink: 0; border-radius: 999px;
        background: var(--accent); color: #fff; font-family: var(--mono); font-size: 12px; font-weight: 700;
      }
      @media (prefers-color-scheme: dark) { .sop-num { color: #0e1311; } }
      .readout-note { margin-top: 16px; padding: 12px; background: var(--accent-soft); border-radius: 10px; }

      .search-input {
        width: 100%; border: 1px solid var(--border); background: var(--surface); color: var(--text);
        padding: 12px 16px; font-size: 15px; border-radius: 999px; box-shadow: var(--shadow-card); font-family: inherit;
      }
      .search-input::placeholder { color: var(--dim); }
      .sticky-search { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0; }

      .line-card { display: block; width: 100%; text-align: left; padding: 16px; margin-bottom: 10px; }
      .bar-track { margin-top: 10px; height: 6px; width: 100%; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
      .tip { margin-top: 32px; border-left: 2px solid var(--accent); padding-left: 12px; font-size: 13px; line-height: 1.8; color: var(--dim); }
      .empty-box { margin-top: 24px; border: 1px dashed var(--border); background: var(--surface); padding: 48px 16px; text-align: center; border-radius: var(--radius); font-size: 14px; color: var(--dim); }
      .small-hint { font-size: 12px; line-height: 1.7; color: var(--dim); }
      .hub-dot { display: inline-block; height: 10px; width: 10px; border-radius: 999px; margin-right: 8px; }


      /* ---------- beginner-first ---------- */
      .hero-prog { margin-top: 16px; }
      .hero-prog-track { height: 8px; background: rgba(242,240,230,.22); border-radius: 999px; overflow: hidden; }
      .hero-prog-fill { height: 100%; background: var(--coral); border-radius: 999px; transition: width .5s ease; }
      .hero-prog-txt { margin: 6px 0 0; font-size: 13px; color: var(--hero-dim); }
      .today-one { margin-top: 16px; padding: 18px; }
      .today-one-k { margin: 0; font-size: 13px; font-weight: 700; color: var(--coral); }
      .today-steps { margin: 10px 0 14px; padding-left: 20px; font-size: 14px; line-height: 1.8; color: var(--dim); }
      .start-card { margin-top: 16px; padding: 18px; }
      .step-row { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
      .step-row.last { border-bottom: none; padding-bottom: 2px; }
      .step-num { flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
      @media (prefers-color-scheme: dark) { .step-num { color: #0e1311; } }
      .step-t { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
      .step-d { margin: 4px 0 0; font-size: 14px; line-height: 1.7; color: var(--dim); }
      .map-list { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.8; color: var(--dim); }
      .tools-toggle { margin-top: 16px; width: 100%; padding: 16px; font-size: 15px; font-weight: 700; border: 1.5px dashed var(--border); border-radius: var(--radius); background: var(--surface); color: var(--dim); }
      .order-row { display: flex; gap: 10px; align-items: flex-start; }
      .order-num { flex-shrink: 0; margin-top: 12px; width: 24px; height: 24px; border-radius: 999px; background: var(--surface-2); color: var(--dim); font-family: var(--mono); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .fold-head { margin-top: 28px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 15px; font-weight: 700; text-align: left; box-shadow: var(--shadow-card); color: var(--text); }
      .fold-hint { flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--dim); }
      .fold-body { margin-top: 10px; }
      .next-bar { margin-top: 32px; padding: 18px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid var(--border); }
      /* ---------- bottom tab bar ---------- */
      #tabbar {
        position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #tabbar .inner { margin: 0 auto; width: 100%; max-width: 672px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 4px; }
      .tab-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; color: var(--dim); }
      .tab-btn .pill { position: relative; display: flex; align-items: center; justify-content: center; padding: 4px 14px; border-radius: 999px; transition: background .2s ease; }
      .tab-btn[aria-current="page"] { color: var(--accent); }
      .tab-btn[aria-current="page"] .pill { background: var(--accent-soft); }
      .tab-btn .lbl { font-size: 11px; line-height: 1.3; }
      .tab-btn[aria-current="page"] .lbl { font-weight: 700; }
      .tab-badge {
        position: absolute; right: -2px; top: -4px; padding: 0 4px; font-family: var(--mono);
        font-size: 10px; font-weight: 700; color: #fff; background: var(--coral); border-radius: 999px;
      }
      @media (min-width: 900px) {
        .wrap { max-width: 760px; }
        #tabbar .inner { max-width: 760px; }
      }

      /* ---------- 最新版版式补充 ---------- */
      .page-title { font-family: var(--serif); font-size: 24px; line-height: 1.4; font-weight: 900; margin: 0; }
      .field-label { font-size: 13px; font-weight: 700; color: var(--text); margin: 0; }
      .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .head-row .meta { font-family: var(--mono); flex-shrink: 0; font-size: 12px; color: var(--dim); }
      .back-link { display: inline-block; margin-bottom: 12px; padding: 4px 0; font-size: 14px; font-weight: 500; color: var(--dim); }
      .hero-prog-fill { background: #86dcc8; }
      .btn-hero-main { margin-top: 20px; width: 100%; padding: 16px; background: var(--coral); color: #fff; font-size: 18px; font-weight: 700; border-radius: var(--radius); }
      .btn-hero-main:disabled { opacity: .4; cursor: default; }
      .btn-hero-link { margin-top: 12px; width: 100%; padding: 8px; font-size: 14px; font-weight: 500; color: var(--hero-dim); }
      .entry-card { display: block; width: 100%; text-align: left; padding: 16px; margin-bottom: 10px; }
      .entry-card .t { margin: 0; font-size: 15px; font-weight: 700; }
      .entry-card .t .arr { float: right; color: var(--dim); }
      .entry-card .d { margin: 4px 0 0; font-size: 13px; line-height: 1.7; color: var(--dim); }
      .order-num.is-next { background: var(--coral); color: #fff; }
      .order-num.is-done { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { .order-num.is-done { color: #0e1311; } }
      .route-note { margin: -4px 0 4px; font-size: 12px; }
      .footer-note { margin-top: 48px; border-top: 1px solid var(--border); padding-top: 16px; text-align: center; }
      .footer-note p { margin: 0; font-size: 12px; line-height: 1.7; color: var(--dim); }
      .toc-bar {
        position: sticky; top: 0; z-index: 20; margin: 0 -16px; padding: 8px 16px;
        background: var(--bg); border-bottom: 1px solid var(--border);
      }
      .toc-row { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .toc-row::-webkit-scrollbar { display: none; }
      .toc-chip {
        flex-shrink: 0; white-space: nowrap; padding: 6px 12px; font-size: 13px; font-weight: 600;
        border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--dim);
      }
      .toc-chip[aria-current="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
      @media (prefers-color-scheme: dark) { .toc-chip[aria-current="true"] { color: #0e1311; } }
      .dsec-wrap { margin-top: 24px; scroll-margin-top: 118px; }
      .dsec-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; text-align: left; }
      .dsec-head .t { font-size: 15px; font-weight: 700; }
      .dsec-head .tg { flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--accent); }
      .dsec-body { margin-top: 8px; }
      .next-bar {
        margin-top: 36px; padding: 16px; border: none; border-radius: var(--radius);
        background: linear-gradient(155deg, var(--hero-bg) 0%, var(--hero-bg-2) 100%); color: var(--hero-text);
        box-shadow: var(--shadow-lift);
      }
      .mine-dl { flex: 1; font-size: 14px; }
      .mine-dl .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .mine-dl .row:last-child { margin-bottom: 0; }
      .mine-dl dt { color: var(--dim); }
      .mine-dl dd { margin: 0; font-family: var(--mono); font-weight: 700; }
      .grade-badge { flex-shrink: 0; padding: 2px 6px; font-size: 11px; font-weight: 700; border-radius: 4px; }
      .data-actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
      .btn-outline { border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; }
      .btn-danger { border: 1px solid var(--coral); background: var(--coral); color: #fff; font-weight: 600; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; }
      .data-msg { margin: 12px 0 0; font-size: 13px; line-height: 1.7; }
      .data-msg-ok { color: var(--accent); }
      .data-msg-err { color: var(--coral); }
